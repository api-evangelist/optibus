openapi: 3.0.0
info:
  title: Optibus Operations Driver Absences Driver App Notifications API
  version: 2.8.17
  description: '**Welcome to the Optibus Operations API documentation!**


    Optibus Operations is a cloud-based software solution that enables public transport providers to optimize their operations, planning, and scheduling. Our API provides programmatic access to Optibus Operations'' functionality, allowing you to integrate it with your own applications and systems.



    '
  license:
    name: Optibus Ltd, All rights reserved
  contact: {}
servers:
- url: https://YOUR-OPTIBUS-ACCOUNT.api.ops.optibus.co
  description: Contact your Optibus Customer Success Manager for the actual baseURL and API credentials to use.
tags:
- name: Driver App Notifications
paths:
  /driver-app/notifications-custom-action-public-key:
    get:
      operationId: GetPublicKey
      responses:
        '200':
          description: Public key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDriverAppNotificationsCustomActionPublicKeyResponse'
      description: 'Returns the public key that can be used to verify the payloads attached to URLs

        opened via a custom action attached to a notification received in the Optibus Driver App.


        No authentication is required to access this endpoint.'
      summary: Fetch driver app notifications custom action public key
      tags:
      - Driver App Notifications
      security: []
      parameters: []
components:
  schemas:
    GetDriverAppNotificationsCustomActionPublicKeyResponse:
      properties:
        publicKeyType:
          type: string
          description: The type of the public key, currently always `RSA_2048`
        publicKey:
          type: string
          description: The public key in PEM format
      required:
      - publicKeyType
      - publicKey
      type: object
      description: 'Response body containing the public key that can be used to verify the payloads attached to

        URLs opened via a custom action attached to a notification received in the Optibus Driver App.'
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      in: header
