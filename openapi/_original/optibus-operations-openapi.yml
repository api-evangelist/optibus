        description: Filter drivers by custom attribute value, using bracket notation `customAttributes[<attributeId>]=value`.
          Repeat a key to match any of several values (OR) for that attribute, e.g. `customAttributes[azienda]=A&customAttributes[azienda]=B`;
          listing several distinct attribute keys requires a driver to match all of them (AND). Matching
          uses the attribute's value effective on the date given by `onDate` (or today if omitted). NUMBER
          attributes are matched numerically (`20`, `20.0` and `20.00` are equivalent); all other types
          are matched exactly and case-sensitively, so e.g. leading zeros in string values are significant.
