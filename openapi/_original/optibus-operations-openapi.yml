            When `daysLimit` is `1` or more, split the date range into `/v2/duty-stats` requests of at
            most

            `daysLimit` days each — task or driver filters do not change this limit. When `daysLimit`
            is `0`,

            even a single full day is too big: batch by tasks instead (see `tasksLimit`).'
