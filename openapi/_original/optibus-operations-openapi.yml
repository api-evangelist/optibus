        '422':
          description: 'Possible error types: `invalidAttributeTimeline` (some edits result in invalid
            attribute timelines), `driversNotFound` (one or more driver IDs specified in the request do
            not exist in the system)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutDriversCustomAttributesErrorResponse'
      description: "Creates or updates custom attribute entries for drivers. Although the `POST /v2/drivers`\
        \ and `PUT /v2/drivers` API endpoints also allow you to create and update custom attribute values,\n\
        they are more limited in that they only allow you to create and update custom attribute values\
        \ as of the current date. This API endpoint allows you to manage the full history of\ncustom attribute\
        \ values for drivers.\n\nNotes:\n- The specification of expected values and whether they are mandatory\
        \ or not is determined by the attribute definitions in the \"Driver attributes\" preference in\
        \ your Ops instance.\n  - Attributes with type `STRING` expect a string to be set for `value`.\n\
        \  - Attributes with type `NUMBER` expect a number to be set for `value`.\n  - Attributes with\
        \ type `BOOLEAN` expect a boolean to be set for `value`.\n  - Attributes with type `DATE` expect\
        \ a date string formatted as `YYYY-MM-dd` to be set for `value`.\n  - Attributes with type `SINGLE_SELECT`\
        \ expect the `value` of one of the available select options to be set for `value`.\n  - Attributes\
        \ with type `MULTI_SELECT` expect an array of strings (each one being the `value` of one of the\
        \ available select options) to be set for `value`.\n  - Attributes with type `DURATION` expect\
        \ a duration string formatted as `HH:mm` (where `HH` is an integer between 0 and 999, and `mm`\
        \ is an integer between 0 and 59) to be set for `value`.\n  - Attributes configured with `\"isMandatory\"\
        : false` allow the value to be 'unset' - simply omit the `value` field for that entry to unset\
        \ it.\n- Behaviour of the `entryId` field:\n  - If an `entryId` is specified and an entry with\
        \ that ID already exists, the existing entry will be updated.\n  - If an `entryId` is specified\
        \ and an entry with that ID does not already exist, a new entry will be created with the specified\
        \ ID.\n  - If an `entryId` is not specified, a new entry will be created with an automatically\
        \ generated ID.\n- You must maintain the consistency of the attribute timeline:\n  - No entries\
        \ for a given attribute on a given driver should overlap each other\n  - There should be no gap\
        \ between the date periods of entries for a given attribute on a given driver (i.e. if one entry\
        \ ends on `2024-01-01`, the next entry should start on `2024-01-02`)\n  - Each attribute on a\
        \ given driver should have exactly one entry with no end date\n- For non-mandatory attributes,\
        \ if you wish to represent a period with 'no value set', create an entry with no `value` field\
        \ for that date period.\n- Each request is atomic - either all entries listed in the request are\
        \ created/updated successfully, or none are created/updated.\n- No more than 1000 entries can\
        \ be created/updated in a single request - please break your request into multiple smaller chunks\
        \ if you need to create/update more than 1000 entries."
      summary: Create/update driver custom attributes
      tags:
      - Driver Custom Attributes
      security:
      - api_key: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutDriversCustomAttributesRequest'
