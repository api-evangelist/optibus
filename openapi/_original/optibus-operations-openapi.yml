      - $ref: '#/components/schemas/ExpandedTaskEventBase_RechargeEventJsonData.OnScheduleEventsTypes.Recharge_'
      - $ref: '#/components/schemas/ExpandedTaskEventBase_SubTripEventJsonData.OnScheduleEventsTypes.SubTrip_'
      - $ref: '#/components/schemas/ExpandedTaskEventBase_AttendanceEventJsonData.OnScheduleEventsTypes.Attendance_'
    ExpandedTaskEventsWithBlock:
      allOf:
      - $ref: '#/components/schemas/ExpandedTaskEventsRequiringBlockId'
      - $ref: '#/components/schemas/BlockId'
    ExternalExpandedTaskEvent_ExpandedTaskEvent_:
      anyOf:
      - $ref: '#/components/schemas/ExpandedTaskEventsNotRequiringBlockId'
      - $ref: '#/components/schemas/ExpandedTaskEventsWithBlock'
    ExternalCalendarTaskV2:
      allOf:
      - $ref: '#/components/schemas/ExternalCalendarTaskBase_Omit_DutyEventSummary-and-LocationSummary.originDepot-or-originStop-or-destinationDepot-or-destinationStop_-or-_type-TaskType__'
      - properties:
          spareType:
            type: string
          events:
            items:
              $ref: '#/components/schemas/ExternalExpandedTaskEvent_ExpandedTaskEvent_'
            type: array
        type: object
    DepotOperationalPlanV2:
      allOf:
      - $ref: '#/components/schemas/DepotOperationalPlanBaseV2'
      - properties:
          blocks:
            items:
              $ref: '#/components/schemas/CalendarBlock'
            type: array
            description: The information for blocks
          tasks:
            items:
              $ref: '#/components/schemas/ExternalCalendarTaskV2'
            type: array
            description: The information for tasks
        required:
        - blocks
        - tasks
        type: object
    GetOperationalPlanV2Element:
      allOf:
      - $ref: '#/components/schemas/DepotOperationalPlanV2'
      - properties:
          opUnits:
            items:
              properties:
                code:
                  type: string
                name:
                  type: string
                uuid:
                  type: string
              required:
              - code
              - name
              - uuid
              type: object
            type: array
          depotName:
            type: string
          depotUuid:
            type: string
        required:
        - depotName
        - depotUuid
        type: object
    GetOperationalPlanV2Response:
      items:
        $ref: '#/components/schemas/GetOperationalPlanV2Element'
      type: array
    PlannedTaskAssignment:
      properties:
        opUnitUuid:
          type: string
        cancellationReason:
          $ref: '#/components/schemas/DutyCancellationReason'
          description: if disabled = true and the customer has configured cancellation reasons, then this
            is present
        disabled:
          type: boolean
        driverId:
          $ref: '#/components/schemas/UUID'
        taskId:
          $ref: '#/components/schemas/UUID'
      required:
      - taskId
      type: object
    CalendarDailyPlannedInformation:
      properties:
        tasks:
          items:
            $ref: '#/components/schemas/PlannedTaskAssignment'
          type: array
        date:
          $ref: '#/components/schemas/StringifyDate'
      required:
      - tasks
      - date
      type: object
    ExternalCalendarTaskSummary:
      anyOf:
      - $ref: '#/components/schemas/DutyEventSummary'
      - properties:
          type:
            $ref: '#/components/schemas/TaskType'
        required:
        - type
        type: object
    ExternalCalendarTaskBase_ExternalCalendarTaskSummary_:
      allOf:
      - $ref: '#/components/schemas/Omit_CalendarTask.events-or-summary-or-disabled-or-cancellationCode-or-cancellationReason_'
      - properties:
          spareType:
            type: string
          attributes:
            $ref: '#/components/schemas/Record_AttributeId.AttributeValue_'
          summary:
            $ref: '#/components/schemas/ExternalCalendarTaskSummary'
          dutyType:
            type: string
          type:
            $ref: '#/components/schemas/TaskType'
        required:
        - summary
        - type
        type: object
      - $ref: '#/components/schemas/SourceMeta'
    ExternalCalendarTask:
      allOf:
      - $ref: '#/components/schemas/ExternalCalendarTaskBase_ExternalCalendarTaskSummary_'
      - properties:
          spareType:
            type: string
          events:
            items:
              $ref: '#/components/schemas/ExternalCalendarTaskEvent_TaskEvent_'
            type: array
        type: object
    GetCalendarPlannedAssignmentsResponse:
      properties:
        tasks:
          items:
            $ref: '#/components/schemas/ExternalCalendarTask'
          type: array
        calendarDailyPlannedInformation:
          items:
            $ref: '#/components/schemas/CalendarDailyPlannedInformation'
          type: array
      required:
      - tasks
      - calendarDailyPlannedInformation
      type: object
    GetDriverDayLabelsResponse:
      items:
        properties:
          labelName:
            type: string
          labelCode:
            type: string
          driverId:
            type: string
          date:
            $ref: '#/components/schemas/StringifyDate'
        required:
        - labelName
        - labelCode
        - driverId
        - date
        type: object
      type: array
    StringifyDateRange:
      properties:
        to:
          $ref: '#/components/schemas/StringifyDate'
        from:
          $ref: '#/components/schemas/StringifyDate'
      required:
      - to
      - from
      type: object
      description: Stringified date range.
    CalendarPlanInformation:
      properties:
        deployDateRange:
          $ref: '#/components/schemas/StringifyDateRange'
        group:
          type: string
        rosterId:
          $ref: '#/components/schemas/UUID'
        plan:
          $ref: '#/components/schemas/UUID'
      required:
      - deployDateRange
      - group
      - rosterId
      - plan
      type: object
    TaskAssignment:
      allOf:
      - $ref: '#/components/schemas/PlannedTaskAssignment'
      - properties:
          lastAssignedDriverId:
            type: string
            nullable: true
          attributes:
            $ref: '#/components/schemas/Record_AttributeId.AttributeValue_'
          labels:
            items:
              $ref: '#/components/schemas/Label'
            type: array
          vehicleId:
            $ref: '#/components/schemas/UUID'
          originalDriverId:
            $ref: '#/components/schemas/UUID'
        type: object
    CalendarDailyInformation:
      properties:
        tasks:
          items:
            $ref: '#/components/schemas/TaskAssignment'
          type: array
        date:
          $ref: '#/components/schemas/StringifyDate'
      required:
      - tasks
      - date
      type: object
    VehicleAssignment:
      properties:
        originalVehicleId:
          $ref: '#/components/schemas/UUID'
        vehicleId:
          $ref: '#/components/schemas/UUID'
        blockId:
          $ref: '#/components/schemas/UUID'
      required:
      - blockId
      type: object
    CalendarVehicleAssignment:
      properties:
        tasks:
          items:
            $ref: '#/components/schemas/VehicleAssignment'
          type: array
        date:
          $ref: '#/components/schemas/StringifyDate'
      required:
      - tasks
      - date
      type: object
    CalendarInformation:
      properties:
        calendarVehicleAssignments:
          items:
            $ref: '#/components/schemas/CalendarVehicleAssignment'
          type: array
        blocks:
          items:
            $ref: '#/components/schemas/CalendarBlock'
          type: array
        tasks:
          items:
            $ref: '#/components/schemas/ExternalCalendarTask'
          type: array
        DailyTasks:
          items:
            $ref: '#/components/schemas/CalendarDailyInformation'
          type: array
        deployedPlans:
          items:
            $ref: '#/components/schemas/CalendarPlanInformation'
          type: array
        depotId:
          type: string
      required:
      - calendarVehicleAssignments
      - blocks
      - tasks
      - DailyTasks
      - deployedPlans
      - depotId
      type: object
    GetCalendarResponse:
      $ref: '#/components/schemas/CalendarInformation'
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      in: header
info:
  title: Optibus Operations API
  version: 2.8.17
  description: '**Welcome to the Optibus Operations API documentation!**


    Optibus Operations is a cloud-based software solution that enables public transport providers to optimize
    their operations, planning, and scheduling. Our API provides programmatic access to Optibus Operations''
    functionality, allowing you to integrate it with your own applications and systems.



    '
  license:
    name: Optibus Ltd, All rights reserved
  contact: {}
paths:
  /v1/vehicles:
    get:
      operationId: GetVehiclesInfoV1
      responses:
        '200':
          description: Vehicles fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVehiclesV1SuccessfulResponse'
        '400':
          description: 'Possible error types: `Invalid request schema` (schema of your request does not
            match the specification)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaValidationErrorResponse'
        '404':
          description: 'Possible error types: `pageNotFound` (requested page number is out of range; details.totalPages
            indicates the number of pages available)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVehiclesV1ErrorResponse'
      description: 'List existing vehicles in the system, with optional filtering capability.


        Notes:

        - The result is paginated. Check the `pagination` property in the response to see the total number
        of pages and the current page number.'
      summary: List vehicles
      tags:
      - Vehicles
      security:
      - api_key: []
      parameters:
      - description: '- Comma-separated list of vehicle IDs to filter for'
        in: query
        name: vehicleIds
        required: false
        schema:
          type: string
      - description: '- Date string formatted as `YYYY-MM-dd` for which we want data returned. If not
          provided, today''s date will be used. The date specified here affects the data returned for
          certain properties such as `mainRegionPeriod`, `loanedRegionPeriods`, `decommissioned`, and
          `customAttributes`, and also the behaviour of the `isDecommissioned` and `regionNames` query
          parameters.'
        in: query
        name: onDate
        required: false
        schema:
          type: string
      - description: '- Comma-separated list of region names to filter on. Vehicles belonging to any of
          the regions (either main or loaned) on the date specified by `onDate` (or today''s date if not
          provided) will be returned.'
        in: query
        name: regionNames
        required: false
        schema:
          type: string
      - description: '- Whether to filter for decommissioned vehicles on the date specified by `onDate`
          (or today''s date if not provided). Set to `true` to filter for decommissioned vehicles, and
          `false` to filter for active vehicles. Leave unspecified to return all vehicles.'
        in: query
        name: isDecommissioned
        required: false
        schema:
          type: boolean
      - description: '- 1-indexed integer indicating which page of results to pull'
        in: query
        name: page
        required: false
        schema:
          $ref: '#/components/schemas/PageNumber'
    post:
      operationId: PostVehicles
      responses:
        '201':
          description: Vehicles created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostVehiclesSuccessResponse'
        '400':
          description: 'Possible error types: `Invalid request schema` (schema of your request does not
            match the specification), `tooManyItems` (you specified >1000 items in your request), `noItems`
            (you specified 0 items in your request), `invalidFieldContent` (the content of one or more
            fields in your request is invalid)'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PostVehiclesErrorResponse'
                - $ref: '#/components/schemas/SchemaValidationErrorResponse'
        '409':
          description: 'Possible error types: `conflictProcessingRequest` (temporary concurrency conflict,
            retry shortly), `vehicleAlreadyExists` (one or more vehicle IDs specified in the request already
            exist in the system)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostVehiclesErrorResponse'
      description: "Add new vehicles to the system.\n\nNotes:\n- This API endpoint does not support modifying\
        \ existing vehicles. If you need to update an existing vehicle, use the `PUT /v1/vehicles` API\
        \ endpoint instead.\n- Each request is atomic - either all vehicles listed in the request are\
        \ created successfully, or none are created.\n- No more than 1000 vehicles can be created in a\
        \ single request - please break your request into multiple smaller chunks if you need to create\
        \ more than 1000 vehicles.\n- The specification of expected values for the `customAttributes`\
        \ field and whether they are mandatory or not is determined by the attribute definitions in the\
        \ \"Vehicle attributes\" preference in your Ops instance.\n  - Attributes with type `STRING` expect\
        \ a string to be set for `customAttributes[attributeId]`.\n  - Attributes with type `NUMBER` expect\
        \ a number to be set for `customAttributes[attributeId]`.\n  - Attributes with type `BOOLEAN`\
        \ expect a boolean to be set for `customAttributes[attributeId]`.\n  - Attributes with type `DATE`\
        \ expect a date string formatted as `YYYY-MM-dd` to be set for `customAttributes[attributeId]`.\n\
        \  - Attributes with type `SINGLE_SELECT` expect the `value` of one of the available select options\
        \ to be set for `customAttributes[attributeId]`.\n  - Attributes with type `MULTI_SELECT` expect\
        \ an array of strings (each one being the `value` of one of the available select options) to be\
        \ set for `customAttributes[attributeId]`.\n  - Attributes with type `DURATION` expect a duration\
        \ string formatted as `HH:mm` (where `HH` is an integer between 0 and 999, and `mm` is an integer\
        \ between 0 and 59) to be set for `customAttributes[attributeId]`."
      summary: Create vehicles
      tags:
      - Vehicles
      security:
      - api_key: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostVehiclesRequest'
    put:
      operationId: PutVehicles
      responses:
        '200':
          description: Vehicles updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutVehiclesSuccessResponse'
        '400':
          description: 'Possible error types: `Invalid request schema` (schema of your request does not
            match the specification), `tooManyItems` (you specified >1000 items in your request), `noItems`
            (you specified 0 items in your request), `invalidFieldContent` (the content of one or more
            fields in your request is invalid)'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PutVehiclesErrorResponse'
                - $ref: '#/components/schemas/SchemaValidationErrorResponse'
        '409':
          description: 'Possible error types: `conflictProcessingRequest` (temporary concurrency conflict,
            retry shortly)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutVehiclesErrorResponse'
        '422':
          description: 'Possible error types: `vehiclesNotFound` (one or more vehicle IDs specified in
            the request do not exist in the system)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutVehiclesErrorResponse'
      description: "Update existing vehicles in the system.\n\nNotes:\n- This API endpoint expects a full\
        \ representation of the vehicle. Omitting an optional field will clear the field, with one exception:\
        \ `mainRegionPeriod` (see below).\n- This API endpoint does not support creating new vehicles.\
        \ If you need to create a new vehicle, use the `POST /v1/vehicles` API endpoint instead.\n- Each\
        \ request is atomic - either all vehicles listed in the request are updated successfully, or none\
        \ are updated.\n- No more than 1000 vehicles can be updated in a single request - please break\
        \ your request into multiple smaller chunks if you need to update more than 1000 vehicles.\n-\
        \ The specification of expected values for the `customAttributes` field and whether they are mandatory\
        \ or not is determined by the attribute definitions in the \"Vehicle attributes\" preference in\
        \ your Ops instance.\n  - Attributes with type `STRING` expect a string to be set for `customAttributes[attributeId]`.\n\
        \  - Attributes with type `NUMBER` expect a number to be set for `customAttributes[attributeId]`.\n\
        \  - Attributes with type `BOOLEAN` expect a boolean to be set for `customAttributes[attributeId]`.\n\
        \  - Attributes with type `DATE` expect a date string formatted as `YYYY-MM-dd` to be set for\
        \ `customAttributes[attributeId]`.\n  - Attributes with type `SINGLE_SELECT` expect the `value`\
        \ of one of the available select options to be set for `customAttributes[attributeId]`.\n  - Attributes\
        \ with type `MULTI_SELECT` expect an array of strings (each one being the `value` of one of the\
        \ available select options) to be set for `customAttributes[attributeId]`.\n  - Attributes with\
        \ type `DURATION` expect a duration string formatted as `HH:mm` (where `HH` is an integer between\
        \ 0 and 999, and `mm` is an integer between 0 and 59) to be set for `customAttributes[attributeId]`.\n\
        - If the value of any custom attribute is updated compared to the existing value, a new entry\
        \ will be added to the history of that attribute starting from the current date. If an entry for\
        \ that attribute already exists starting today, it will be overwritten instead, and an `overwriteCustomAttributeEntry`\
        \ warning will be returned in the response.\n- `mainRegionPeriod` is the **only optional field\
        \ whose omission does not clear the value**. Every vehicle must always belong to a region, so\
        \ there is no way to remove a region assignment - you can only change it to a different region.\
        \ Omitting `mainRegionPeriod` (or sending the same value currently returned by `GET /v1/vehicles`)\
        \ leaves the vehicle's region assignment untouched. Sending a different region/depot creates a\
        \ new region period starting today; if a region period already starts today it is overwritten\
        \ in place and an `overwriteMainRegionPeriodEntry` warning is returned in the response.\n- When\
        \ there are non-fatal side effects (for example, today's entries being overwritten), the response\
        \ includes a `warnings` array describing them. The property is omitted when there are no warnings.\
        \ The request is still considered successful when warnings are returned."
      summary: Update vehicles
      tags:
      - Vehicles
      security:
      - api_key: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutVehiclesRequest'
  /vehicles/depot-period:
    get:
      operationId: GetVehiclesDepotPeriods
      responses:
        '200':
          description: Vehicles depot periods
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVehiclesDepotPeriodsResponse'
        '414':
          description: The request URI exceeds 10240 bytes which is not supported. This probably results
            from trying to query more than a thousand vehicles at the same time. Please consider chunking
            your request.
      description: Returns the information about the vehicles depot periods by vehicle ID.
      summary: Fetch vehicle region periods
      tags:
      - Vehicles
      security:
      - api_key: []
      parameters:
      - description: '- Returns the depot periods for the given vehicle IDs'
        in: query
        name: vehicleId
        required: false
        schema:
          type: array
          items:
            type: string
  /v1/vehicles/downtimes:
    get:
      operationId: GetVehiclesDowntimes
      responses:
        '200':
          description: Vehicle downtimes fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVehiclesDowntimesSuccess'
        '400':
          description: 'Possible error types: `Invalid request schema` (schema of your request does not
            match the specification), `invalidDatesCombination` (the combination of fromDate and toDate
            is invalid)'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GetVehiclesDowntimesErrorResponse'
                - $ref: '#/components/schemas/SchemaValidationErrorResponse'
        '404':
          description: 'Possible error types: `pageNotFound` (requested page number is out of range; details.totalPages
            indicates the number of pages available)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVehiclesDowntimesErrorResponse'
      description: "List existing vehicle downtimes in the system, with optional filtering capability.\n\
        \nNotes:\n- The result is paginated. Check the `pagination` property in the response to see the\
        \ total number of pages and the current page number.\n- Information about the modelling of date/time\
        \ periods for each entry:\n  - `startDate` is mandatory\n  - `endDate` is optional - if omitted,\
        \ the downtime will be ongoing indefinitely\n  - `startTime` and `endTime` are optional - if omitted,\
        \ the downtime will be for the entire day(s) specified by `startDate` and `endDate`"
      summary: List vehicle downtimes
      tags:
      - Vehicle Downtimes
      security:
      - api_key: []
      parameters:
      - description: '- Comma-separated list of vehicle IDs to filter for'
        in: query
        name: vehicleIds
        required: false
        schema:
          type: string
      - description: '- Date string formatted as `YYYY-MM-dd`. Only downtimes that end on or after this
          date are returned.'
        in: query
        name: fromDate
        required: false
        schema:
          type: string
      - description: '- Date string formatted as `YYYY-MM-dd`. Only downtimes that start on or before
          this date are returned.'
        in: query
        name: toDate
        required: false
        schema:
          type: string
      - description: '- 1-indexed integer indicating which page of results to pull'
        in: query
        name: page
        required: false
        schema:
          $ref: '#/components/schemas/PageNumber'
    put:
      operationId: PutVehiclesDowntimes
      responses:
        '200':
          description: Vehicle downtimes created and/or updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutVehiclesDowntimesSuccessResponse'
        '400':
          description: 'Possible error types: `Invalid request schema` (schema of your request does not
            match the specification), `invalidFieldContent` (the content of one or more fields in your
            request is invalid), `noItems` (you specified 0 items in your request), `tooManyItems` (you
            specified >1000 items in your request)'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/PutVehiclesDowntimesErrorResponse'
                - $ref: '#/components/schemas/SchemaValidationErrorResponse'
        '409':
          description: 'Possible error types: `conflictProcessingRequest` (temporary concurrency conflict,
            retry shortly)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutVehiclesDowntimesErrorResponse'
        '422':
          description: 'Possible error types: `vehiclesNotFound` (one or more vehicle IDs specified in
            the request do not exist in the system)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutVehiclesDowntimesErrorResponse'
      description: "Creates or updates downtimes for vehicles. As input, provide a list of downtime entries\
        \ to create or update.\n\nNotes:\n- Behaviour of the `downtimeId` field:\n  - If a `downtimeId`\
        \ is specified and a downtime with that ID already exists, the existing downtime will be updated.\n\
        \  - If a `downtimeId` is specified and a downtime with that ID does not already exist, a new\
        \ downtime will be created with the specified ID.\n  - If a `downtimeId` is not specified, a new\
        \ downtime will be created with an automatically generated ID.\n- Information about the modelling\
        \ of date/time periods for each entry:\n  - `startDate` is mandatory\n  - `endDate` is optional\
        \ - if omitted, the downtime will be ongoing indefinitely\n  - `startTime` and `endTime` are optional\
        \ - if omitted, the downtime will be for the entire day(s) specified by `startDate` and `endDate`\n\
        - Each request is atomic - either all downtimes listed in the request are created/updated successfully,\
        \ or none are created/updated.\n- No more than 1000 downtimes can be created/updated in a single\
        \ request - please break your request into multiple smaller chunks if you need to create/update\
        \ more than 1000 downtimes."
      summary: Create/update vehicle downtimes
      tags:
      - Vehicle Downtimes
      security:
      - api_key: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutVehiclesDowntimesRequest'
  /v1/vehicles/custom-attributes:
    get:
      operationId: GetVehiclesCustomAttributes
      responses:
        '200':
          description: Vehicles custom attributes fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVehiclesCustomAttributesSuccess'
        '400':
          description: 'Possible error types: `Invalid request schema` (schema of your request does not
            match the specification), `invalidDatesCombination` (the combination of fromDate and toDate
            is invalid)'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/GetVehiclesCustomAttributesErrorResponse'
                - $ref: '#/components/schemas/SchemaValidationErrorResponse'
        '404':
          description: 'Possible error types: `pageNotFound` (requested page number is out of range; details.totalPages
            indicates the number of pages available)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetVehiclesCustomAttributesErrorResponse'
      description: "List custom attribute entries for vehicles, with filters. Although the `GET /v1/vehicles`\
        \ API endpoint also returns custom attribute values for\neach vehicle, it is more limited, as\
        \ it only returns attribute values for the specified date. This API endpoint allows you to query\
        \ the full history\nof attribute values for vehicles, and see the date range in which those values\
        \ applied.\n\nNotes:\n- The result is paginated. Check the `pagination` property in the response\
        \ to see the total number of pages and the current page number.\n  - The exact number of entries\
        \ per page may vary, as the results are paginated by _vehicle_ rather than count of entries.\n\
        - The entry history for the `type` field is also queryable through this endpoint. These entries\
        \ appear under attribute ID `vehicleType`.\n- The specification for values and whether they are\
        \ mandatory or not is determined by the attribute definitions in the \"Vehicle attributes\" preference\
        \ in your Ops instance.\n  - Attributes with type `STRING` will have `value` set to a string\n\
        \  - Attributes with type `NUMBER` will have `value` set to a number\n  - Attributes with type\
        \ `BOOLEAN` will have `value` set to a boolean\n  - Attributes with type `DATE` will have `value`\
        \ set to a date string formatted as `YYYY-MM-dd`\n  - Attributes with type `SINGLE_SELECT` will\
        \ have `value` set to the `value` of one of the available select options\n  - Attributes with\
        \ type `MULTI_SELECT` will have `value` set to an array of strings (each one being the `value`\
        \ of one of the available select options)\n  - Attributes with type `DURATION` will have `value`\
        \ set to a duration string formatted as `HH:mm` (where `HH` is an integer between 0 and 999, and\
        \ `mm` is an integer between 0 and 59)\n  - Attributes configured with `\"isMandatory\": false`\
        \ may possibly have periods where the value is not set - in that case, the `value` will be omitted\
        \ from the response\n- Information about the modelling of date periods for each entry:\n  - `startDate`\
        \ is mandatory\n  - `endDate` is optional - if omitted, the entry value will be ongoing indefinitely\
        \ into the future"
      summary: List vehicle custom attributes
      tags:
      - Vehicle Custom Attributes
      security:
      - api_key: []
      parameters:
      - description: '- Comma-separated list of vehicle IDs to filter for'
        in: query
