          $ref: '#/components/schemas/DepotId'
      - description: '- Optional. An array of driver IDs for whom workEntities are to be retrieved.'
        in: query
        name: driverIds
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/DriverUuid'
      - description: '- The start date of the workEntities period.'
        in: query
        name: startDate
        required: false
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- The end date of the workEntities period.'
        in: query
        name: endDate
        required: false
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- Optional. If true, all workEntities will be exported, regardless of the configuration.'
        in: query
        name: exportAllEntities
        required: false
        schema:
          type: boolean
      - description: '- Optional. Will attempt to retreive the data from the cache if true. If false,
          will always calculate the data.'
        in: query
        name: shouldUseCache
        required: false
        schema:
          type: boolean
  /v2/stats:
    get:
      operationId: GetStats
      responses:
        '200':
          description: Statistics Information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetStatsResponse'
        '413':
          description: The request is too long. Please reduce the number of drivers.
      description: 'Retrieves statistics values for drivers on a specified date.

        Statistics are configured in the customer''s preferences and can include normal (daily), yearly,
        and accumulated types.

        Normal stats are calculated via the work engine, while yearly and accumulated stats are fetched
        from the yearly cache.

        Either driverIds or depotId must be provided to scope the request. There is a calculation limit
        per request to avoid timeouts. For normal stats, the limit is based on the number of configured
        work-entities (204k total calculations). For yearly/accumulated stats, the limit is based on the
        number of requested cache entities. In case the limit is exceeded, a 413 error code will be returned,
        together with the allowed number of drivers.'
      summary: Fetch statistics
      tags:
      - Statistics
      security:
      - api_key: []
      parameters:
      - description: '- The date for which statistics are to be retrieved. Required, in YYYY-MM-DD format.'
        in: query
        name: date
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- The ID of a specific depot for which statistics are to be retrieved. Either depotId
          or driverIds must be provided.'
        in: query
        name: depotId
        required: false
        schema:
          $ref: '#/components/schemas/DepotId'
      - description: '- An array of driver IDs for whom statistics are to be retrieved. Either driverIds
          or depotId must be provided.'
        in: query
        name: driverIds
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/DriverUuid'
      - description: '- Optional. An array of statistic IDs to filter the results. If not provided, all
          configured statistics are returned.'
        in: query
        name: statIds
        required: false
        schema:
          type: array
          items:
            type: string
  /v2/payroll:
    get:
      operationId: GetPayroll
      responses:
        '200':
          description: Payroll information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPayrollV2Response'
        '413':
          description: The request is too long. Please reduce the number of drivers or days.
      description: 'Retrieves payroll values for depots within a specified date range and for specified
        driver IDs or by depotId.

        There is a limit of 204k work-entities calculation per request to avoid timeouts. This limit enables,
        for example,

        a calculation of 100 drivers for 30 days with 100 daily work-entities defined. In case the limit
        is exceeded, a 413 error code will be returned, together with the allowed amount of drivers for
        the existing configuration.


        This endpoint is only available if the `Use Payroll V2` feature flag is enabled and work-entity
        as well as payroll rules have been properly setup.'
      summary: Fetch payroll
      tags:
      - Payroll
      security:
      - api_key: []
      parameters:
      - description: '- Optional. The ID of a specific depot for which payroll is to be retrieved.'
        in: query
        name: depotId
        required: false
        schema:
          type: string
      - description: '- Optional. An array of driver IDs for whom payroll is to be retrieved.'
        in: query
        name: driverIds
        required: false
        schema:
          type: array
          items:
            type: string
      - description: '- The start date of the payroll period'
        in: query
        name: startDate
        required: false
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- The end date of the payroll period'
        in: query
        name: endDate
        required: false
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- Optional. An array of paycodes to filter the payroll values by. If not provided,
          all paycodes are returned.'
        in: query
        name: paycodes
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/CodeId'
      - description: '- Optional. Will attempt to retreive the data from the cache if true. If false,
          will always calculate the data.'
        in: query
        name: shouldUseCache
        required: false
        schema:
          type: boolean
  /v2/duty-stats:
    get:
      operationId: GetDutyStats
      responses:
        '200':
          description: Duty statistics for the requested range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDutyStatsResponse'
        '413':
          description: 'The request exceeds the calculation limit. Size it with GET /v2/duty-stats-calculation-limit:
            at most daysLimit days per request, or — when daysLimit is 0 — one day per request with at
            most tasksLimit taskIds.'
      description: "Retrieves per-task statistics for a date range, mirroring the duty side panel in the\
        \ Ops UI.\nOne response row per `(date, task)` pair, including the statistics configured under\
        \ the customer's `dutyFilter` preference.\n\nTo avoid timeouts the calculation is capped. Call\
        \ `GET /v2/duty-stats-calculation-limit` first with\nthe same dates and depots to size your requests.\
        \ This endpoint returns 413 when:\n- the requested range spans more than `daysLimit` days, or\n\
        - `daysLimit` is `0` (a day too dense to fetch whole) and the request is not a single day\n  (`fromDate`\
        \ equal to `toDate`) with a `taskIds` filter of at most `tasksLimit` tasks."
      summary: Fetch per-task statistics for a date range
      tags:
      - Statistics
      security:
      - api_key: []
      parameters:
      - description: '- Start of the date range (inclusive), YYYY-MM-DD.'
        in: query
        name: fromDate
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- End of the date range (inclusive), YYYY-MM-DD. Must be `>= fromDate`.'
        in: query
        name: toDate
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- Optional. Restrict to specific depots; all customer depots if omitted.'
        in: query
        name: depotIds
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
      - description: '- Optional. Restrict to duties assigned to these drivers.'
        in: query
        name: driverIds
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
      - description: '- Optional. Defaults to `false` when `driverIds` is provided, `true` when omitted.'
        in: query
        name: includeUnassigned
        required: false
        schema:
          type: boolean
      - description: '- Optional. Filter by internal task UUIDs (not display IDs). Required when `daysLimit`
          is `0` — see above.'
        in: query
        name: taskIds
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
      - description: '- Optional. Restrict which statistics to compute. `"*"` is not allowed.'
        in: query
        name: statIds
        required: false
        schema:
          type: array
          items:
            type: string
  /v2/duty-stats-calculation-limit:
    get:
      operationId: GetDutyStatsCalculationLimit
      responses:
        '200':
          description: Duty-stats calculation limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDutyStatsCalculationLimitResponse'
      description: "Sizing (pre-flight) call for `GET /v2/duty-stats`. It computes no statistics — it\
        \ only reports the\nlimits that `/v2/duty-stats` will enforce for the given dates and depot scope,\
        \ so callers can plan\ntheir requests up front. Call it with the same `fromDate`/`toDate`/`depotIds`\
        \ you intend to query.\n\nHow to use the returned limits:\n- `daysLimit >= 1` — split the date\
        \ range into `/v2/duty-stats` requests of at most `daysLimit`\n  days each. Task or driver filters\
        \ do not change this limit.\n- `daysLimit = 0` — the data is too dense for even one full day.\
        \ Send one day per request\n  (`fromDate` equal to `toDate`) with a `taskIds` filter of at most\
        \ `tasksLimit` tasks, repeating\n  until the day's tasks are covered."
      summary: Fetch the request limits for /v2/duty-stats
      tags:
      - Statistics
      security:
      - api_key: []
      parameters:
      - description: '- Start of the probe range (inclusive), YYYY-MM-DD.'
        in: query
        name: fromDate
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- End of the probe range (inclusive), YYYY-MM-DD. Must be `>= fromDate`.'
        in: query
        name: toDate
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- Optional. Restrict to specific depots; all customer depots if omitted.'
        in: query
        name: depotIds
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
  /v2/calculation-limit:
    get:
      operationId: GetAPICalculationLimit
      responses:
        '200':
          description: Work-engine APIs calculation limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAPICalculationLimitResponse'
      description: 'Fetches the maximum number of drivers allowed per API request for the given dates
        for a particular client.

        To prevent timeouts, there is a cap of 204000 work-entity calculations per request. This cap allows,
        for instance,

        the calculation of 100 drivers over a 30-day period with 100 daily work-entities specified.


        The `mode` parameter controls which flow''s cost model is used to compute the limit:

        - `payroll` (default): the limit accounts for payroll cycle boundaries that may extend the effective
        date range beyond what was requested. This is the safe default — it always returns a limit `<=`
        the `workEntities` limit, so it can never exceed what `/v2/payroll` will accept. Use this when
        calling `/v2/payroll`.

        - `workEntities`: the limit is based on the exact requested date range. Opt into this when calling
        `/v2/work-entities`.'
      summary: Fetch work engine API calculation limit
      tags:
      - Work Entities
      security:
      - api_key: []
      parameters:
      - description: '- The start date of the calculation period.'
        in: query
        name: startDate
        required: false
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- The end date of the calculation period.'
        in: query
        name: endDate
        required: false
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- Optional. The flow for which to compute the limit (`payroll` or `workEntities`).
          Defaults to `payroll`.'
        in: query
        name: mode
        required: false
        schema:
          $ref: '#/components/schemas/CalculationLimitMode'
  /driver-app/notifications-custom-action-public-key:
