      tags:
      - Driver App Notifications
      security: []
      parameters: []
  /<event-webhook-subscriber-endpoint>:
    post:
      operationId: EventWebhookPost
      responses:
        '202':
          description: Operational Webhook Event successfully enqueued by the consumer
      description: "### Operational Webhook Events from Optibus OPS system\n\n Optibus OPS Event Webhooks\
        \ deliver operational changes triggered by users in the OPS platform to subscribers as outbound\
        \ HTTP webhook requests.\n\n#### ODS format based\n\nActions supported will be sent in requests\
        \ to the subscribers, containing all the entities that were changed,\nsuch as `runs`, `run_assignments`,\
        \ `run_events`, `blocks` and `block_assignments` with a format that has been inspired by ODS,\n\
        following the same terminology for the name of attributes and entities, despite there's additional\
        \ information to enrich the event payload.\n\nNote: Internal IDs can be found in attributes with\
        \ `_internal_id` suffix, such as `run_internal_id` and `block_internal_id` and these can be used\
        \ to uniquely identify entities\nif the OPS API is consumed, but for the integration these IDs\
        \ shouldn't be used. It's recommended to use `run_id` and `block_id` to uniquely identify entities.\n\
        \n#### Subscriber URL and configuration\n\nTo set up a subscription, the subscriber must provide:\n\
        - Callback URL – The endpoint where requests will be delivered.\n- Subscription Window – The relative\
        \ range of operational days for which they want to receive events (e.g., previous and next days).\n\
        - Action Types – The list of `action_type` operations they want to receive on this endpoint.\n\
        - Operational Day Start Time – The time at which the customer’s or agency’s operational day begins.\n\
        \n#### Auth\n\nThe subscriber will receive a secret token that will be used to validate the request\
        \ comes from Optibus as a trusted source.\nBefore sending the webhook, we generate an HMAC signature\
        \ using the same secret key for the request body, then include the result in a header `X-HMAC-SIGNATURE`.\n\
        The subscriber will need to validates the request by generating the signature following the same\
        \ process on their side and then comparing it to the `X-HMAC-SIGNATURE` header.\nIf there's a\
        \ match, the request should be accepted; otherwise, it should be rejected as it might come from\
        \ an unauthorized source.\n\nTo generate a signature is a simple as:\n```\n import crypto from\
        \ \"crypto\";\n return crypto\n.createHmac(\"sha256\", subscriber.secret)\n.update(JSON.stringify(eventWebhookPayload),\
        \ \"utf8\")\n.digest(\"base64\");\n```\n\n#### Sequential processing of events\n\nIt's important\
        \ that operational webhook events that belong to an `aggregate_id`, value that's always included\
        \ in every request payload,\nare sequentially processed by the consumers in order to guarantee\
        \ correctness, given that operations could depend on each and if not\nprocessed chronologically\
        \ in the order they were triggered, it could lead to data inconsistencies.\n\n`aggregate_id` represents\
        \ a funnel for all actions in a specific operational region and parallelism across different `aggregate_id`\
        \ should be\nconsidered by the subscribers.\n\n#### Retry mechanism\n\n##### Successful Processing\n\
        If the subscriber returns any 2xx status code, the request is considered successfully processed.\
        \ No further action will be taken.\n##### Retry Mechanism\nIf the subscriber fails to process\
        \ the request (e.g., due to server issues or downtime), the system will retry the request using\
        \ an exponential backoff strategy for up to 2 minutes.\nRetries will be triggered when the subscriber\
        \ responds with one of the following status codes:\n- 5xx (server errors)\n- 408 (Request Timeout)\n\
        - 409 (Conflict)\n- 422 (Unprocessable Entity)\n- 425 (Too Early)\n- 429 (Too Many Requests)\n\
        ##### Non-Retryable Responses\n- 4xx Errors (except those listed above): No retries will be attempted,\
        \ as these indicate client-side issues that must be fixed by the subscriber.\n- 3xx Redirects:\
        \ No retries will be attempted. Subscribers must provide a valid, direct URL that does not require\
        \ redirection.\n##### Sequential Processing by aggregate_id\nOperational webhook events for a\
        \ given aggregate_id are processed sequentially.\nIf a request for that aggregate_id fails and\
        \ is being retried, no new events will be delivered for that same aggregate_id until:\nThe request\
        \ succeeds, or\nThe retry window (2 minutes) expires.\n\n#### Request body payload examples for\
        \ operational actions supported\n\n<details>\n<summary><strong>Unassign Duty Operation</strong></summary>\n\
        \n```json\n{\n  \"id\": \"90cb367f-3680-48c2-93a2-b162cb11ce9a\",\n  \"customer\": \"superbus\"\
        ,\n  \"created_at\": \"2024-10-09T16:19:01.300Z\",\n  \"aggregate_id\": \"operational-calendar-0d277b74-ab79-493f-8f1d-ec307420868d\"\
        ,\n  \"region_id\": \"0d277b74-ab79-493f-8f1d-ec307420868d\",\n  \"operational_actions\": [\n\
        \    {\n      \"action_type\": \"unassign_duty\",\n      \"operational_date\": \"2024-10-09\"\
        ,\n      \"entities_changes\": [\n        {\n          \"blocks\": [],\n          \"block_assignments\"\
        : [],\n          \"runs\": [],\n          \"run_assignments\": [\n            {\n            \
        \  \"run_internal_id\": \"b045c6f4-f827-4e82-833a-1c5e713ad0b2\",\n              \"date\": \"\
        2024-10-09\",\n              \"driver_id\": null,\n              \"run_id\": \"VU1002\",\n   \
        \           \"service_id\": \"etf0C81iX7\",\n              \"entity_operation\": \"update\"\n\
        \            }\n          ],\n          \"run_events\": []\n        }\n      ]\n    }\n  ]\n}\n\
        ```\n</details>\n\n<details>\n<summary><strong>Assign Duty Operation</strong></summary>\n\n```json\n\
        {\n  \"id\": \"90cb367f-3680-48c2-93a2-b162cb11ce9a\",\n  \"customer\": \"superbus\",\n  \"created_at\"\
        : \"2024-10-09T16:19:01.300Z\",\n  \"aggregate_id\": \"operational-calendar-0d277b74-ab79-493f-8f1d-ec307420868d\"\
        ,\n  \"region_id\": \"0d277b74-ab79-493f-8f1d-ec307420868d\",\n  \"operational_actions\": [\n\
        \    {\n      \"action_type\": \"assign_duty\",\n      \"operational_date\": \"2024-10-09\",\n\
        \      \"entities_changes\": [\n        {\n          \"blocks\": [],\n          \"block_assignments\"\
        : [],\n          \"runs\": [],\n          \"run_assignments\": [\n            {\n            \
        \  \"run_internal_id\": \"b045c6f4-f827-4e82-833a-1c5e713ad0b2\",\n              \"date\": \"\
        2024-10-09\",\n              \"driver_id\": \"driver-123\",\n              \"run_id\": \"VU1002\"\
        ,\n              \"service_id\": \"etf0C81iX7\",\n              \"entity_operation\": \"update\"\
        \n            }\n          ],\n          \"run_events\": []\n        }\n      ]\n    }\n  ]\n\
        }\n```\n</details>\n\n<details>\n<summary><strong>Unassign Block Operation</strong></summary>\n\
        \n```json\n{\n  \"id\": \"90cb367f-3680-48c2-93a2-b162cb11ce9a\",\n  \"customer\": \"superbus\"\
        ,\n  \"created_at\": \"2024-10-09T16:19:01.300Z\",\n  \"aggregate_id\": \"operational-calendar-0d277b74-ab79-493f-8f1d-ec307420868d\"\
        ,\n  \"region_id\": \"0d277b74-ab79-493f-8f1d-ec307420868d\",\n  \"operational_actions\": [\n\
        \    {\n      \"action_type\": \"unassign_block\",\n      \"operational_date\": \"2025-09-24\"\
        ,\n      \"entities_changes\": [\n        {\n          \"blocks\": [],\n          \"block_assignments\"\
        : [\n            {\n              \"block_id\": \"Block EU3006\",\n              \"block_internal_id\"\
        : \"bd8c55d2-7359-47b0-9a90-228872130eec\",\n              \"date\": \"2025-09-24\",\n       \
        \       \"vehicle_id\": null,\n              \"entity_operation\": \"update\",\n             \
        \ \"service_id\": \"QtyCFMaby\"\n            }\n          ],\n          \"runs\": [],\n      \
        \    \"run_assignments\": [],\n          \"run_events\": []\n        }\n      ]\n    }\n  ]\n\
        }\n```\n</details>\n\n<details>\n<summary><strong>Assign Block Operation</strong></summary>\n\n\
        ```json\n{\n  \"id\": \"90cb367f-3680-48c2-93a2-b162cb11ce9a\",\n  \"customer\": \"superbus\"\
        ,\n  \"created_at\": \"2024-10-09T16:19:01.300Z\",\n  \"aggregate_id\": \"operational-calendar-0d277b74-ab79-493f-8f1d-ec307420868d\"\
        ,\n  \"region_id\": \"0d277b74-ab79-493f-8f1d-ec307420868d\",\n  \"operational_actions\": [\n\
        \    {\n      \"action_type\": \"assign_block\",\n      \"operational_date\": \"2025-09-24\",\n\
        \      \"entities_changes\": [\n        {\n          \"blocks\": [],\n          \"block_assignments\"\
        : [\n            {\n              \"block_id\": \"Block EU3006\",\n              \"block_internal_id\"\
        : \"bd8c55d2-7359-47b0-9a90-228872130eec\",\n              \"date\": \"2025-09-24\",\n       \
        \       \"vehicle_id\": \"Vehicle 230\",\n              \"entity_operation\": \"update\",\n  \
        \            \"service_id\": \"QtyCFMaby\"\n            }\n          ],\n          \"runs\": [],\n\
        \          \"run_assignments\": [],\n          \"run_events\": []\n        }\n      ]\n    }\n\
        \  ]\n}\n```\n</details>\n\n<details>\n<summary><strong>Swap Duties Operation</strong></summary>\n\
        \n```json\n{\n  \"id\": \"90cb367f-3680-48c2-93a2-b162cb11ce9a\",\n  \"customer\": \"superbus\"\
        ,\n  \"created_at\": \"2024-10-09T16:19:01.300Z\",\n  \"aggregate_id\": \"operational-calendar-0d277b74-ab79-493f-8f1d-ec307420868d\"\
        ,\n  \"region_id\": \"0d277b74-ab79-493f-8f1d-ec307420868d\",\n  \"operational_actions\": [\n\
        \    {\n      \"action_type\": \"assign_block\",\n      \"operational_date\": \"2025-09-24\",\n\
        \      \"entities_changes\": [\n        {\n          \"blocks\": [],\n          \"block_assignments\"\
        : [],\n          \"runs\": [],\n          \"run_assignments\": [\n            {\n            \
        \  \"run_internal_id\": \"48afea60-81ce-428c-bc93-622961f2e9b5\",\n              \"date\": \"\
        2024-10-09\",\n              \"driver_id\": \"Driver 124\",\n              \"run_id\": \"Duty\
        \ VU1000\",\n              \"service_id\": \"etf0C81iX7\",\n              \"entity_operation\"\
        : \"update\"\n            }\n          ],\n          \"run_events\": []\n        },\n        {\n\
        \          \"blocks\": [],\n          \"block_assignments\": [],\n          \"runs\": [],\n  \
        \        \"run_assignments\": [\n            {\n              \"run_internal_id\": \"b045c6f4-f827-4e82-833a-1c5e713ad0b2\"\
        ,\n              \"date\": \"2024-10-09\",\n              \"driver_id\": \"Driver 421\",\n   \
        \           \"run_id\": \"Duty VU2000\",\n              \"service_id\": \"etf0C81iX7\",\n    \
        \          \"entity_operation\": \"update\"\n            }\n          ],\n          \"run_events\"\
        : []\n        }\n      ]\n    }\n  ]\n}\n```\n</details>\n\n<details>\n<summary><strong>Cut/split\
        \ Duty Operation</strong></summary>\n\n```json\n{\n  \"id\": \"90cb367f-3680-48c2-93a2-b162cb11ce9a\"\
        ,\n  \"customer\": \"superbus\",\n  \"created_at\": \"2024-10-09T16:19:01.300Z\",\n  \"aggregate_id\"\
        : \"operational-calendar-0d277b74-ab79-493f-8f1d-ec307420868d\",\n  \"region_id\": \"0d277b74-ab79-493f-8f1d-ec307420868d\"\
        ,\n  \"operational_actions\": [\n    {\n       \"action_type\": \"cut_duty\",\n       \"operational_date\"\
        : \"2025-09-24\",\n       \"entities_changes\": [\n         {\n           \"blocks\": [],\n  \
        \         \"block_assignments\": [],\n           \"runs\": [\n             {\n               \"\
        run_internal_id\": \"acaebae9-9804-4a2d-bd66-62f7cbb925a8\",\n               \"run_id\": \"EU1008\
        \ (1/2)\",\n               \"original_run_internal_id\": \"9da47cf8-f45b-40a0-a150-18f09503b2c1\"\
        ,\n               \"entity_operation\": \"create\",\n               \"original_run_id\": \"EU1008\"\
        ,\n               \"reference_from\": \"split\"\n             },\n             {\n           \
        \    \"run_internal_id\": \"2b26543c-9094-4ebe-b3f0-e8789cd5a4a1\",\n               \"run_id\"\
        : \"EU1008 (2/2)\",\n               \"original_run_internal_id\": \"9da47cf8-f45b-40a0-a150-18f09503b2c1\"\
