              schema:
                $ref: '#/components/schemas/GetDriverDayLabelsResponse'
        '403':
          description: The request was not successfully authenticated. Ensure the authentication header
            is correctly set.
        '414':
          description: The request URI exceeds 10240 bytes which is not supported. This probably results
            from trying to query more than a thousand driversIds/taskIds at the same time. Please consider
            chunking your request.
      description: Returns the calendar planned assignments and tasks, with filters.
      summary: List driver day labels
      tags:
      - Operational Plan
      security:
      - api_key: []
      parameters:
      - description: '- Returns the driver day labels from this date (both fromDate and toDate are required)'
        in: query
        name: fromDate
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- Returns the the driver day labels to this date (both fromDate and toDate are required)'
        in: query
        name: toDate
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- optional. Returns the driver day labels for the filtered driver IDs'
        in: query
        name: driverIds
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
  /{depotId}/calendar:
    get:
      operationId: GetCalendarInfo
      responses:
        '200':
          description: calendar tasks info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCalendarResponse'
        '302':
          description: redirect url
      description: 'Returns the Daily and Weekly tasks for a specified date range, with filters.

        Responds with 302 redirect when payload is too big.

        OriginalDriverId refers to the driver that was assigned to the task in the plan page


        **Spare Types Support**: When the spare types feature flag is enabled, spare tasks will include
        additional properties:

        - `spareType`: The spare type code (e.g., "SPARE1", "SPARE2")

        - `displayId`: Will show the configured spare type name instead of the original display ID

        - `dutyType`: Will be set to "spare" for spare tasks

        - `startTime` and `endTime`: Will be included in the task summary for spare tasks based on the
        relevant spare type preference configuration'
      summary: Fetch calendar tasks
      tags:
      - Tasks
      security:
      - api_key: []
      parameters:
      - description: '- The depot to get the tasks from'
        in: path
        name: depotId
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - description: '- The start of the date range to return the tasks from'
        in: query
        name: from
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- The end of the date range to return the tasks from'
        in: query
        name: to
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '-  Returns tasks from the given plans'
        in: query
        name: plan
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
      - description: '- Returns tasks from deployed plans for the given groups'
        in: query
        name: group
        required: false
        schema:
          type: array
          items:
            type: string
      - description: '- Returns tasks from the given types'
        in: query
        name: type
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/TaskType'
      - description: '-  Returns tasks that are either assigned or unassigned (depending on the input)'
        in: query
        name: assignedOnly
        required: false
        schema:
          type: boolean
      - description: '-  Returns the stops of tasks (false by default)'
        in: query
        name: includeStops
        required: false
        schema:
          type: boolean
      - description: '-  Returns the assignments of filtered driver'
        in: query
        name: driversIds
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
servers:
- url: https://YOUR-OPTIBUS-ACCOUNT.api.ops.optibus.co
  description: Contact your Optibus Customer Success Manager for the actual baseURL and API credentials
    to use.
tags:
- name: Roster
  description: A roster describes the daily operator runs grouped into packages of (repeating) weekly
    work assignments.
- name: Vehicles
  description: API endpoints for managing vehicles.
- name: Vehicle Downtimes
  description: API endpoints for managing downtimes for vehicles - i.e. periods where they are unavailable
    for service.
- name: Vehicle Custom Attributes
  description: API endpoints for managing custom attributes for vehicles - i.e. additional properties
    that can be set for vehicles - including querying and updating their historical values.
- name: Drivers
  description: API endpoints for managing drivers.
- name: Driver Groups
  description: API endpoints for managing driver groups.
- name: Driver Absences
  description: API endpoints for managing absences for drivers - i.e. periods where they are unavailable
    for work.
- name: Driver Employment Periods
  description: API endpoints for managing employment periods for drivers - i.e. periods where they are
    employed, hired, terminated, etc.
- name: Driver Volunteering Periods
  description: API endpoints for fetching volunteering periods for drivers - i.e. periods where a driver
    is willing to volunteer for extra work, such as on a rest day or for overtime.
- name: Driver Custom Attributes
  description: API endpoints for managing custom attributes for drivers - i.e. additional properties that
    can be set for drivers - including querying and updating their historical values.
- name: Signing Times
  description: API endpoints for fetching sign-on/off times & deviations for drivers - i.e. the actual
    and expected sign-on and sign-off times for a driver and how much they deviate from each other.
- name: Statistics
  description: API endpoints for fetching computed statistics over a date range - per-task duty statistics
    (mirroring the duty side panel in the Ops UI) and the calculation limits that bound a single request.
- name: Vehicles (Deprecated)
  description: These API endpoints are deprecated and could be removed in a future version. Please use
    the corresponding new API endpoints instead, which should offer improved usability and extra functionality.
- name: Drivers (Deprecated)
  description: These API endpoints are deprecated and could be removed in a future version. Please use
    the corresponding new API endpoints instead, which should offer improved usability and extra functionality.
- name: Operational Plan (Deprecated)
  description: These API endpoints are deprecated and could be removed in a future version. Please use
    GET /v2/operational-plan instead.
- name: Tacho Ingestion
  description: API endpoint for ingesting normalized Tachograph activity data from the Data Team.
- name: HR System Integration Guides
  description: "This section gives step-by-step guides for common integration scenarios with external\
    \ HR systems. For help with your particular integration scenario, please contact your Optibus Customer\
    \ Success Manager.\n\n# Synchronizing Driver Information with an External HR System\n\n## External\
    \ HR System ➡️ Optibus Operations\n\nThis use case details how to create and update driver information\
    \ in Optibus when changes are made in your external HR system.\n\n**Process:**\n\n1.  **Driver Creation\
    \ in External HR System:**\n\n    When a new driver is created in your HR system, make a `POST` request\
    \ to the [`/v2/drivers` API endpoint](#tag/Drivers/operation/postDriversV2).\n\n    **Example Request:**\n\
    \n    ```http\n    POST /v2/drivers\n    Authorization: <YOUR_API_TOKEN>\n    Content-Type: application/json\n\
    \n    {\n      \"drivers\": [\n        {\n          \"id\": \"driver-id-001\",\n          \"firstName\"\
    : \"John\",\n          \"lastName\": \"Smith\",\n          \"regionName\": \"North Region\",\n   \
    \       \"startDate\": \"2024-01-15\",\n          \"emailAddress\": \"john.smith@example.com\"\n \
    \       }\n      ]\n    }\n    ```\n\n    **Notes:**\n    - Each request is atomic - either all drivers\
    \ are created successfully, or none are created.\n    - Maximum 1000 drivers per request.\n    - If\
    \ `startDate` is provided, an initial employment period will be created automatically.\n    - We recommend\
    \ using the ID of the driver in the external HR system as the `id` field in the request, so that the\
    \ driver has the same identifier in both of your systems.\n\n2.  **Driver Modification in External\
    \ HR System:**\n\n    When an existing driver is edited in your HR system, make a `PUT` request to\
    \ the [`/v2/drivers` API endpoint](#tag/Drivers/operation/putDriversV2).\n\n    **Example Request:**\n\
    \n    ```http\n    PUT /v2/drivers\n    Authorization: <YOUR_API_TOKEN>\n    Content-Type: application/json\n\
    \n    {\n      \"drivers\": [\n        {\n          \"id\": \"driver-id-001\",\n          \"firstName\"\
    : \"John\",\n          \"lastName\": \"Smith-Jones\",\n          \"emailAddress\": \"john.smithjones@example.com\"\
    ,\n          \"customAttributes\": {\n            \"licenseNumber\": \"DL123456\"\n          }\n \
    \       }\n      ]\n    }\n    ```\n\n    **Notes:**\n    - This endpoint expects a **full representation**\
    \ of the driver - omitting optional fields will clear them.\n    - Maximum 1000 drivers per request.\n\
    \    - PUT does not support `startDate`, `regionName`, `depotName`, or `groupName` fields.\n\n## Optibus\
    \ Operations ➡️ External HR System\n\nThis use case describes how to regularly update an external\
    \ HR system with driver information from Optibus using a recurring job (e.g., a cron job).\n\n**Process:**\n\
    \n1.  **Fetch Drivers from Optibus:**\n\n    Make a `GET` request to the [`/v2/drivers` API endpoint](#tag/Drivers/operation/getDriversV2).\
    \ The response is paginated.\n\n    **Example Request:**\n\n    ```http\n    GET /v2/drivers?page=1&isEmployed=true\n\
    \    Authorization: <YOUR_API_TOKEN>\n    ```\n\n    **Example Response:**\n\n    ```json\n    {\n\
    \      \"drivers\": [\n        {\n          \"id\": \"driver-id-001\",\n          \"firstName\": \"\
    John\",\n          \"lastName\": \"Smith\",\n          \"emailAddress\": \"john.smith@example.com\"\
    ,\n          \"mainRegionPeriod\": {\n            \"regionName\": \"North Region\",\n            \"\
    depotName\": \"Main Depot\"\n          },\n          \"customAttributes\": {\n            \"licenseNumber\"\
    : \"DL123456\"\n          }\n        }\n      ],\n      \"pagination\": {\n        \"currentPage\"\
    : 1,\n        \"totalPages\": 5\n      }\n    }\n    ```\n\n2.  **Process Drivers:**\n\n    - For\
    \ each driver in the `drivers` array, create or update the corresponding record in your HR system\
    \ using the driver's `id` as the identifier.\n    - If `pagination.currentPage` < `pagination.totalPages`,\
    \ increment the `page` parameter and repeat until all pages are processed.\n\n\n\n# Synchronizing\
    \ Driver Absences with an External HR System\n\n## External HR System ➡️ Optibus Operations\n\nThis\
    \ use case details how to reflect changes made to driver absences in an external HR system within\
    \ Optibus.\n\n**Process:**\n\n1.  **Absence Creation in External HR System:**\n\n    - When a new\
    \ absence is created in your HR system:\n      - Assign a **unique identifier** to this absence. We\
    \ recommend using UUIDs (Universally Unique Identifiers).\n      - Make a `POST` request to the [`/v1/absences`\
    \ API endpoint](#tag/Driver-Absences/operation/postDriverAbsences).\n      - The request body **must\
    \ be an array** containing one or more absence objects. For a single creation, this will be an array\
    \ with one element. Each absence object should include the unique `absenceId`, `code` (absence type),\
    \ `driverId`, `startDate`, `startTime`, `endDate`, and `endTime`. Refer to the API documentation for\
    \ the full list of required and optional parameters per absence object.\n      - Note: times are represented\
    \ as **minutes from midnight** (e.g., 540 = 09:00, 1020 = 17:00), in the local timezone of your operation.\n\
    \n    **Example `POST` Request Body for Creating an Absence:**\n\n    ```json5\n    [\n      {\n \
    \       \"absenceId\": \"your-new-unique-uuid-string\",\n        \"driverId\": \"driver-id-789\",\n\
    \        \"code\": \"PERSONAL\",\n        \"startDate\": \"2024-02-01\",\n        \"startTime\": 600,\
    \ // 10:00\n        \"endDate\": \"2024-02-01\",\n        \"endTime\": 720, // 12:00\n        \"notes\"\
    : \"Personal appointment\"\n      }\n    ]\n    ```\n\n    **API Call:**\n\n    ```http\n    POST\
    \ /v1/absences\n    Authorization: <YOUR_API_TOKEN>\n    Content-Type: application/json\n\n    //\
    \ Request body from above (array containing the absence object)\n    ```\n\n2.  **Absence Modification\
    \ in External HR System:**\n\n    - When an existing absence is edited in your HR system (e.g., change\
    \ in dates, absence type):\n      - Make a `POST` request to the `/v1/absences` endpoint in the Optibus\
    \ API. This endpoint handles updates (upserts) for absences.\n      - **Crucially, ensure you use\
    \ the same `absenceId`** as the original absence.\n      - The request body **must be an array** containing\
    \ the absence object(s) to be updated.\n      - Update the relevant fields within the absence object,\
    \ such as `code`, `startDate`, `startTime`, `endDate`, and `endTime`, as needed.\n      - Note: times\
    \ are represented as **minutes from midnight** (e.g., 540 = 09:00, 1020 = 17:00), in the local timezone\
    \ of your operation.\n\n    **Example `POST` Request Body for Updating an Absence:**\n    _(Note the\
    \ `absenceId` is the same as an existing absence in Optibus)_\n\n    ```json\n    [\n      {\n   \
    \     \"absenceId\": \"your-existing-unique-uuid-string\",\n        \"driverId\": \"driver-id-789\"\
    ,\n        \"code\": \"SICK\",\n        \"startDate\": \"2024-02-01\",\n        \"startTime\": 600,\
    \ // 10:00\n        \"endDate\": \"2024-02-02\",\n        \"endTime\": 720, // 12:00\n        \"notes\"\
    : \"Updated: Doctor's appointment, extended\"\n      }\n    ]\n    ```\n\n    **API Call:**\n\n  \
    \  ```http\n    POST /v1/absences\n    Authorization: <YOUR_API_TOKEN>\n    Content-Type: application/json\n\
    \n    // Request body from above (array containing the updated absence object)\n    ```\n\n    - **Note\
    \ on Changing Assigned Driver:** The Optibus API does not currently support changing the `driverId`\
    \ for an existing absence directly through an update. If a driver assignment needs to be changed for\
    \ an absence:\n      1.  The original absence must be deleted from Optibus. See \"Absence Deletion\"\
    \ below.\n      2.  A new absence record must be created with a **new unique `absenceId`** and the\
    \ correct `driverId` using the creation process described above (sent in an array).\n\n    - **Balance\
    \ Validation**: When the `entitlementBanksEffectiveDate` feature flag is enabled, the API validates\
    \ that absences do not cause negative balance violations for entitlement banks that do not allow negative\
    \ balances. If violations are detected, the API returns HTTP 422 with details about which drivers\
    \ have violations and which banks are affected.\n      - You can skip balance validation by adding\
    \ the query parameter `skipBalanceValidation=true` to your request (e.g., `POST /v1/absences?skipBalanceValidation=true`).\n\
    \      - The HTTP 422 error can only occur when ALL of the following conditions are met:\n       \
    \ 1. The `entitlementBanksEffectiveDate` feature flag is enabled\n        2. Entitlement banks are\
    \ configured and do NOT allow negative balances\n        3. The driver has entitlements\n        4.\
    \ The absence is connected to the bank (by absence type)\n        5. The driver would violate the\
    \ balance constraints (would cause negative balance)\n        6. The `skipBalanceValidation` query\
    \ parameter is NOT set to \"true\" (validation is enabled by default)\n\n      **Example HTTP 422\
    \ Error Response:**\n\n      ```json\n      {\n        \"error\": {\n          \"type\": \"negativeBalanceViolation\"\
    ,\n          \"message\": \"One or more absences would cause negative balance violations\",\n    \
    \      \"details\": {\n            \"drivers\": [\n              {\n                \"driverId\":\
    \ \"driver-id-123\",\n                \"violatedBanks\": [\"Vacation\", \"Sick\"]\n              },\n\
    \              {\n                \"driverId\": \"driver-id-456\",\n                \"violatedBanks\"\
    : [\"Vacation\"]\n              }\n            ],\n            \"summary\": {\n              \"affectedDrivers\"\
    : 2\n            }\n          }\n        }\n      }\n      ```\n\n3.  **Absence Deletion in External\
    \ HR System:**\n    - When an absence is deleted from your HR system:\n      - The Optibus API **does\
    \ not currently support the direct deletion of absences** via an API endpoint.\n      - Please contact\
    \ Optibus if you require this functionality in the API.\n\n## Optibus Operations ➡️ External HR System\n\
    \nThis use case describes how to regularly update an external HR system with driver absence data from\
    \ Optibus. This is typically achieved by setting up a recurring job (e.g., a cron job).\n\n**Process:**\n\
    \n1.  **Schedule a Recurring Job:**\n\n    - Configure a cron job or a similar scheduled task to run\
    \ at a desired frequency (e.g., every X hours, or once per day).\n\n2.  **Fetch Driver Absences from\
    \ Optibus:**\n\n    - The job should make a `GET` request to the [`/v2/drivers/absences` API endpoint](#tag/Driver-Absences/operation/getAbsencesV2).\n\
    \    - The API response is paginated and includes an array of absence objects.\n    - Note: times\
    \ are represented as **minutes from midnight** (e.g., 540 = 09:00, 1020 = 17:00), in the local timezone\
    \ of your operation.\n\n    **Example `GET` Request:**\n    _(The specific endpoint and any necessary\
    \ query parameters, like date ranges, should be used as per the Optibus API specification. Example\
    \ below uses `/v2/drivers/absences` with date filtering.)_\n\n    ```http\n    GET /v2/drivers/absences?fromDate=2024-01-01&toDate=2024-01-31&page=1\n\
    \    Authorization: <YOUR_API_TOKEN>\n    ```\n\n    **Query Parameters:**\n    - `driverIds`: Comma-separated\
    \ list of driver IDs to filter for (optional)\n    - `absenceCode`: Comma-separated list of absence\
    \ type codes to filter for (optional)\n    - `fromDate`: Returns only absences that end on or after\
    \ this date (YYYY-MM-DD) (optional)\n    - `toDate`: Returns only absences that start on or before\
    \ this date (YYYY-MM-DD) (optional)\n    - `page`: 1-indexed page number (defaults to 1)\n\n    **Example\
    \ JSON Response:**\n\n    ```json\n    {\n      \"absences\": [\n        {\n          \"absenceId\"\
    : \"uuid-string-for-absence-1\",\n          \"absenceCode\": \"SICK\",\n          \"driverId\": \"\
    driver-id-123\",\n          \"startDate\": \"2024-01-10\",\n          \"endDate\": \"2024-01-11\"\
    ,\n          \"startTime\": 540,\n          \"endTime\": 1020,\n          \"note\": \"Flu symptoms\"\
    \n        },\n        {\n          \"absenceId\": \"uuid-string-for-absence-2\",\n          \"absenceCode\"\
    : \"VACATION\",\n          \"driverId\": \"driver-id-456\",\n          \"startDate\": \"2024-01-15\"\
    ,\n          \"endDate\": \"2024-01-20\"\n        },\n        {\n          \"absenceId\": \"uuid-string-for-absence-3\"\
    ,\n          \"absenceCode\": \"PERSONAL\",\n          \"driverId\": \"driver-id-456\",\n        \
    \  \"startDate\": \"2024-01-25\",\n          \"endDate\": \"2024-01-25\",\n          \"startTime\"\
    : 600,\n          \"endTime\": 840,\n          \"note\": \"Appointment\"\n        }\n      ],\n  \
    \    \"pagination\": {\n        \"currentPage\": 1,\n        \"totalPages\": 3,\n        \"nextPage\"\
    : 2\n      }\n    }\n    ```\n\n3.  **Process Absences:**\n    - Check the `pagination` property in\
    \ the response to determine if there are more pages to fetch.\n    - For each page, iterate through\
    \ the `absences` array.\n    - For each absence object:\n      - **Existing Absence:** If the `absenceId`\
    \ already exists in your external HR system, update the corresponding record with the latest information.\n\
    \      - **New Absence:** If the `absenceId` does not exist in your external HR system, create a new\
    \ absence record using the data provided.\n      - **Note:** `startTime` and `endTime` are optional\
    \ and represent minutes from midnight. Convert these to time strings if needed (e.g., 540 minutes\
    \ = 09:00).\n    - Continue fetching subsequent pages by incrementing the `page` parameter until all\
    \ pages have been processed.\n\n\n\n# Synchronizing Time Off (Entitlement) Balances with an External\
    \ HR System\n\nTime off balances represent accrued entitlement (e.g. vacation days, sick leave) per\
    \ driver and bank. Use the time-off-balances API to import balances from your HR system or to read\
    \ balances for display or synchronization.\n\n## External HR System ➡️ Optibus Operations\n\nUse this\
    \ flow when your HR system is the source of truth for entitlement balances (e.g. annual leave accruals,\
    \ carry-over from previous years).\n\n**Process:**\n\n1.  **Import Balances from External HR System:**\n\
    \n    Make a `POST` request to the [`/v1/drivers/time-off-balances` API endpoint](#tag/Driver-Absences/operation/putTimeOffBalances).\n\
    \n    **Example Request:**\n\n    ```http\n    POST /v1/drivers/time-off-balances\n    Authorization:\
    \ <YOUR_API_TOKEN>\n    Content-Type: application/json\n\n    {\n      \"balances\": [\n        {\n\
    \          \"driverId\": \"driver-id-001\",\n          \"bankName\": \"Vacation\",\n          \"effectiveDate\"\
    : \"2026-01-01\",\n          \"totalBalance\": 25,\n          \"unit\": \"days\"\n        },\n   \
    \     {\n          \"driverId\": \"driver-id-001\",\n          \"bankName\": \"Sick Leave\",\n   \
    \       \"effectiveDate\": \"2026-01-01\",\n          \"totalBalance\": 10,\n          \"unit\": \"\
    days\"\n        }\n      ]\n    }\n    ```\n\n    **Notes:**\n    - Each record sets the total balance\
    \ for a driver/bank as of a specific effective date.\n    - Bank names must match your entitlement\
    \ bank configuration (case-insensitive).\n    - Omit `unit` to use the bank's configured unit; otherwise\
    \ use `\"days\"` or `\"hours\"`.\n    - Use `skipNegativeBalanceValidation: true` in the request body\
    \ to allow imports that would create negative balances (e.g. corrections or migrations).\n    - The\
    \ request is atomic: either all records are applied, or none are.\n    - Negative balance validation\
    \ uses the same calculation as the GET endpoint and is affected by the `entitlementBanksEffectiveDate`\
    \ and `scheduledPayout` feature flags.\n\n## Optibus Operations ➡️ External HR System\n\nUse this\
    \ flow to read current time-off balances from Optibus for display in dashboards or synchronization\
    \ with external systems.\n\n**Process:**\n\n1.  **Fetch Time Off Balances from Optibus:**\n\n    Make\
    \ a `GET` request to the [`/v1/drivers/time-off-balances` API endpoint](#tag/Driver-Absences/operation/getTimeOffBalances).\n\
    \n    **Example Request:**\n\n    ```http\n    GET /v1/drivers/time-off-balances?driverIds=driver-id-001,driver-id-002&onDate=2026-06-15\n\
    \    Authorization: <YOUR_API_TOKEN>\n    ```\n\n    **Query Parameters:**\n    - `driverIds` (required):\
    \ Comma-separated list of driver IDs\n    - `bankNames` (optional): Comma-separated list of bank names\
    \ to filter\n    - `onDate` (optional): Date (YYYY-MM-DD) as of which to calculate balances; defaults\
    \ to today\n\n    **Example Response:**\n\n    ```json\n    [\n      {\n        \"driverId\": \"driver-id-001\"\
    ,\n        \"banks\": [\n          {\n            \"bankName\": \"Vacation\",\n            \"unit\"\
    : \"days\",\n            \"totalBalance\": 25,\n            \"usedBalance\": 5,\n            \"plannedBalance\"\
    : 3,\n            \"remainingBalance\": 17,\n            \"balances\": [\n              { \"effectiveDate\"\
    : \"2026-01-01\", \"totalBalance\": 25 }\n            ]\n          }\n        ]\n      }\n    ]\n\
    \    ```\n\n2.  **Notes:**\n    - Chunk requests when querying many drivers; the URI length limit\
    \ (~10KB) can be exceeded with hundreds of driver IDs.\n    - The response depends on feature flags:\
    \ when `entitlementBanksEffectiveDate` is enabled, balance calculation uses effective-date logic;\
    \ when `scheduledPayout` is enabled, scheduled payouts are included in the balance breakdown and `payoutDates`\
    \ (each date maps to an array of payouts). Contact your Optibus representative for feature flag availability.\n\
    \n---\n\n# Absence quota usage (planner limits)\n\nSome customers configure **absence quotas** in\
    \ Ops (daily or weekly caps on how many drivers may be absent for given absence types, optionally\
    \ split by operational unit). To read the configured quotas and **aggregated usage** for a date range,\
    \ call [`POST /v1/drivers/absence-quotas-query`](#tag/Driver-Absences/operation/getAbsenceQuotas).\n\
    \n**Example:**\n\n```http\nPOST /v1/drivers/absence-quotas-query\nAuthorization: <YOUR_API_TOKEN>\n\
    Content-Type: application/json\n\n{\n  \"from\": \"2026-05-01\",\n  \"to\": \"2026-05-31\",\n  \"\
    depotId\": \"<region-id>\",\n  \"unitIds\": [\"<unit-a>\", \"<unit-b>\"]\n}\n```\n\n**Important:**\
    \ When a quota row defines **unit-level limits** (`depotQuota.unitQuotas` is non-empty), effective\
    \ limits and aggregate usage follow those **per-unit** rows (`usage.byUnit`). The optional depot-level\
    \ `depotQuota.quota` field is **not** the cap that drives totals in that case—use the unit rows (and\
    \ `usage.byUnit`) for enforcement and reporting. When `unitQuotas` is empty, the depot-level `quota`\
    \ applies to the whole depot.\n\n**Compatibility:** `GET /v1/drivers/absence-quotas` remains available\
    \ for existing integrations with query parameters, but new integrations should use `POST /v1/drivers/absence-quotas-query`.\
    \ Query strings can exceed URI limits when parameters are large; use POST when sending large request\
    \ parameters, especially large `simulate` payloads.\n\nSee the OpenAPI operation description for full\
    \ request body and response shape.\n"
- name: Fleet Management System Integration Guides
  description: "This section gives step-by-step guides for common integration scenarios with external\
    \ fleet management systems. For help with your particular integration scenario, please contact your\
    \ Optibus Customer Success Manager.\n\n# Synchronizing Vehicle Information with an External Fleet\
    \ Management System\n\n## External Fleet Management System ➡️ Optibus Operations\n\nThis use case\
    \ details how to create and update vehicle information in Optibus when changes are made in your external\
    \ fleet management system.\n\n**Process:**\n\n1.  **Vehicle Creation in External Fleet Management\
    \ System:**\n\n    When a new vehicle is created in your fleet management system, make a `POST` request\
    \ to the [`/v1/vehicles` API endpoint](#tag/Vehicles/operation/postVehicles).\n\n    **Example Request:**\n\
    \n    ```http\n    POST /v1/vehicles\n    Authorization: <YOUR_API_TOKEN>\n    Content-Type: application/json\n\
    \n    {\n      \"vehicles\": [\n        {\n          \"id\": \"vehicle-001\",\n          \"licensePlate\"\
    : \"ABC-123\",\n          \"regionName\": \"North Region\",\n          \"depotName\": \"Main Depot\"\
    ,\n          \"type\": \"Double Decker\",\n          \"model\": \"Routemaster\"\n        }\n     \
    \ ]\n    }\n    ```\n\n    **Notes:**\n    - Each request is atomic - either all vehicles are created\
    \ successfully, or none are created.\n    - Maximum 1000 vehicles per request.\n    - We recommend\
    \ using the ID of the vehicle in the external fleet management system as the `id` field in the request,\
    \ so that the vehicle has the same identifier in both of your systems.\n\n2.  **Vehicle Modification\
    \ in External Fleet Management System:**\n\n    When an existing vehicle is edited in your fleet management\
    \ system, make a `PUT` request to the [`/v1/vehicles` API endpoint](#tag/Vehicles/operation/putVehicles).\n\
    \n    **Example Request:**\n\n    ```http\n    PUT /v1/vehicles\n    Authorization: <YOUR_API_TOKEN>\n\
    \    Content-Type: application/json\n\n    {\n      \"vehicles\": [\n        {\n          \"id\":\
    \ \"vehicle-001\",\n          \"licensePlate\": \"ABC-456\",\n          \"parkingLocation\": \"Bay\
    \ 15\",\n          \"type\": \"Double Decker\",\n          \"model\": \"Routemaster\",\n         \
    \ \"decommissioned\": false\n        }\n      ]\n    }\n    ```\n\n    **Notes:**\n    - This endpoint\
    \ expects a **full representation** of the vehicle - omitting optional fields will clear them.\n \
    \   - Maximum 1000 vehicles per request.\n    - PUT does not support `regionName` or `depotName` fields.\n\
    \n## Optibus Operations ➡️ External Fleet Management System\n\nThis use case describes how to regularly\
    \ update an external fleet management system with vehicle information from Optibus using a recurring\
    \ job (e.g., a cron job).\n\n**Process:**\n\n1.  **Fetch Vehicles from Optibus:**\n\n    Make a `GET`\
    \ request to the [`/v1/vehicles` API endpoint](#tag/Vehicles/operation/getVehiclesInfoV1). The response\
    \ is paginated.\n\n    **Example Request:**\n\n    ```http\n    GET /v1/vehicles?page=1&isDecommissioned=false\n\
    \    Authorization: <YOUR_API_TOKEN>\n    ```\n\n    **Example Response:**\n\n    ```json\n    {\n\
    \      \"vehicles\": [\n        {\n          \"id\": \"vehicle-001\",\n          \"licensePlate\"\
    : \"ABC-123\",\n          \"parkingLocation\": \"Bay 15\",\n          \"mainRegionPeriod\": {\n  \
    \          \"regionName\": \"North Region\",\n            \"depotName\": \"Main Depot\"\n        \
    \  },\n          \"type\": \"Double Decker\",\n          \"model\": \"Routemaster\",\n          \"\
    decommissioned\": false,\n          \"customAttributes\": {\n            \"capacity\": 42\n      \
    \    }\n        }\n      ],\n      \"pagination\": {\n        \"currentPage\": 1,\n        \"totalPages\"\
    : 5\n      }\n    }\n    ```\n\n2.  **Process Vehicles:**\n\n    - For each vehicle in the `vehicles`\
    \ array, create or update the corresponding record in your fleet management system using the vehicle's\
    \ `id` as the identifier.\n    - If `pagination.currentPage` < `pagination.totalPages`, increment\
    \ the `page` parameter and repeat until all pages are processed.\n\n# Synchronizing Vehicle Downtimes\
    \ with an External Fleet Management System\n\n## External Fleet Management System ➡️ Optibus Operations\n\
    \nThis use case details how to create and update vehicle downtime information in Optibus when changes\
    \ are made in your external fleet management system.\n\n**Process:**\n\n1.  **Downtime Creation or\
    \ Update in External Fleet Management System:**\n\n    When a vehicle downtime is created or updated\
    \ in your fleet management system, make a `PUT` request to the [`/v1/vehicles/downtimes` API endpoint](#tag/Vehicle-Downtimes/operation/putVehiclesDowntimes).\n\
    \n    **Example Request:**\n\n    ```http\n    PUT /v1/vehicles/downtimes\n    Authorization: <YOUR_API_TOKEN>\n\
    \    Content-Type: application/json\n\n    {\n      \"downtimes\": [\n        {\n          \"downtimeId\"\
    : \"downtime-001\",\n          \"vehicleId\": \"vehicle-001\",\n          \"startDate\": \"2024-02-01\"\
    ,\n          \"endDate\": \"2024-02-03\",\n          \"note\": \"Scheduled maintenance\"\n       \
    \ }\n      ]\n    }\n    ```\n\n    **Notes:**\n    - If `downtimeId` is provided and exists, the\
    \ downtime will be updated; otherwise, a new downtime is created.\n    - If `downtimeId` is omitted,\
    \ a new downtime with an auto-generated ID will be created.\n    - Each request is atomic - either\
    \ all downtimes are created/updated successfully, or none are.\n    - Maximum 1000 downtimes per request.\n\
    \    - Note: times are represented as **minutes from midnight** (e.g., 540 = 09:00, 1020 = 17:00),\
    \ in the local timezone of your operation.\n    - If `startTime` and `endTime` are omitted, the downtime\
    \ covers entire day(s).\n    - If `endDate` is omitted, the downtime is ongoing indefinitely.\n\n\
    ## Optibus Operations ➡️ External Fleet Management System\n\nThis use case describes how to regularly\
    \ update an external fleet management system with vehicle downtime data from Optibus using a recurring\
    \ job (e.g., a cron job).\n\n**Process:**\n\n1.  **Fetch Vehicle Downtimes from Optibus:**\n\n   \
    \ Make a `GET` request to the [`/v1/vehicles/downtimes` API endpoint](#tag/Vehicle-Downtimes/operation/getVehiclesDowntimes).\
    \ The response is paginated.\n\n    **Example Request:**\n\n    ```http\n    GET /v1/vehicles/downtimes?fromDate=2024-01-01&toDate=2024-01-31&page=1\n\
    \    Authorization: <YOUR_API_TOKEN>\n    ```\n\n    **Example Response:**\n\n    ```json\n    {\n\
    \      \"downtimes\": [\n        {\n          \"downtimeId\": \"downtime-001\",\n          \"vehicleId\"\
    : \"vehicle-001\",\n          \"startDate\": \"2024-01-10\",\n          \"endDate\": \"2024-01-12\"\
    ,\n          \"startTime\": 540,\n          \"endTime\": 1020,\n          \"note\": \"Scheduled maintenance\"\
    \n        },\n        {\n          \"downtimeId\": \"downtime-002\",\n          \"vehicleId\": \"\
    vehicle-002\",\n          \"startDate\": \"2024-01-15\",\n          \"note\": \"Out of service indefinitely\"\
    \n        }\n      ],\n      \"pagination\": {\n        \"currentPage\": 1,\n        \"totalPages\"\
    : 2\n      }\n    }\n    ```\n\n2.  **Process Downtimes:**\n\n    - For each downtime in the `downtimes`\
    \ array, create or update the corresponding record in your fleet management system using the `downtimeId`\
    \ as the identifier.\n    - Note: times are represented as **minutes from midnight** (e.g., 540 =\
    \ 09:00, 1020 = 17:00), in the local timezone of your operation.\n    - If `pagination.currentPage`\
    \ < `pagination.totalPages`, increment the `page` parameter and repeat until all pages are processed.\n"
- name: Operational Plan Query Guides
  description: "This section gives step-by-step guides for common query scenarios with Optibus Operations\
    \ for retrieving operational plan data. For help with your particular query scenario, please contact\
    \ your Optibus Customer Success Manager.\n\nThis section utilizes the `/v2/operational-plan` endpoint\
    \ for all operational plan data requests.\n\n## Retrieve Duties by Driver and Date\n\nThis use case\
    \ details how to fetch a list of duties assigned to specific drivers within a given date range and\
    \ extract associated block and vehicle information. This is useful for synchronizing driver schedules,\
    \ auditing assignments, or building custom reports.\n\n**Process:**\n\n1.  **Prepare Your Request:**\n\
    \n    - Determine the date range (`fromDate` and `toDate` parameters) for which you want to retrieve\
    \ duties.\n    - Optionally identify the `driverUuids` of the drivers whose duties you want to retrieve.\
    \ These should be provided as a comma-separated string. If omitted, information for all drivers is\
    \ returned.\n    - Optionally, you can specify `depotUuids` to filter the operational plan by specific\
    \ depots. This parameter expects one or more depot UUIDs as a comma-separated string. **Note:** The\
    \ UUIDs for depots can be obtained from the `/v1/regions` endpoint, where they correspond to the `regionUuid`\
    \ property.\n    - Optionally, you can set `includeUnassigned=true` (in conjunction with `driverUuids`)\
    \ to also include unassigned tasks for context around those drivers.\n\n2.  **Make a `GET` Request\
    \ to the Operational Plan Endpoint:**\n\n    - Use the `/v2/operational-plan` API endpoint.\n    -\
    \ Include the `fromDate`, `toDate`, and any desired optional parameters (`driverUuids`, `depotUuids`,\
    \ etc.) as query parameters.\n\n**Example `GET` Request:**\n\n```http\nGET /v2/operational-plan?fromDate=2024-06-01&toDate=2024-06-07&driverUuids=driver-uuid-123&depotUuids=depot-uuid-abc\n\
    Authorization: <YOUR_API_TOKEN>\n```\n\n**Example JSON Response Snippet (Relevant sections):**\n\n\
    The response is an array of depot plans. The following example highlights the properties crucial for\
    \ linking drivers to duties, blocks, and vehicles, showing how to derive the necessary IDs for your\
    \ table.\n\n```json\n[\n  {\n    \"depotUuid\": \"depot-uuid-abc\",\n    \"depotName\": \"Main Depot\"\
    ,\n    \"assignments\": [\n      {\n        \"date\": \"2024-06-01\",\n        \"driverAssignments\"\
    : [\n          {\n            \"driver\": \"driver-uuid-123\",\n            \"assignments\": [\"task-uuid-A\"\
    ]\n          }\n        ],\n        \"vehicleAssignments\": [\n          {\n            \"vehicle\"\
    : \"vehicle-id-XYZ\",\n            \"assignments\": [\"block-id-1\"]\n          }\n        ],\n  \
    \      \"properties\": []\n      }\n    ],\n    \"blocks\": [\n      {\n        \"id\": \"block-id-1\"\
    ,\n        \"displayId\": \"block-display-id-B1\",\n        \"type\": \"block\",\n        \"disabled\"\
    : false,\n        \"summary\": { \"type\": \"Standard Bus\" },\n        \"events\": [\n          {\n\
    \            \"dutyId\": \"task-uuid-A\",\n            \"eventId\": \"event-uuid-X\"\n          }\n\
    \        ]\n      }\n    ],\n    \"tasks\": [\n      {\n        \"id\": \"task-uuid-A\",\n       \
    \ \"type\": \"duty\",\n        \"displayId\": \"Duty 501\",\n        \"summary\": {\n          \"\
    type\": \"duty\",\n          \"startTime\": 480,\n          \"endTime\": 1020\n        },\n      \
    \  \"events\": [\n          {\n            \"uuid\": \"event-uuid-X\",\n            \"eventType\"\
    : \"deadhead\",\n            \"subType\": \"depot_pull_out\",\n            \"startTime\": \"08:00:00\"\
    ,\n            \"endTime\": \"08:30:00\",\n            \"blockId\": \"block-id-1\"\n          }\n\
    \        ]\n      },\n      {\n        \"id\": \"task-uuid-SPARE\",\n        \"type\": \"spare\",\n\
    \        \"displayId\": \"Morning Spare\",\n        \"dutyType\": \"spare\",\n        \"spareType\"\
    : \"SPARE1\",\n        \"summary\": {\n          \"type\": \"spare\",\n          \"startTime\": 360,\n\
    \          \"endTime\": 720\n        },\n        \"events\": []\n      }\n    ],\n    \"drivers\"\
    : [\n      {\n        \"id\": \"driver-ext-123\",\n        \"uuid\": \"driver-uuid-123\",\n      \
    \  \"firstName\": \"John\",\n        \"lastName\": \"Doe\",\n        \"archived\": false\n      }\n\
    \    ],\n    \"vehicles\": [\n      {\n        \"id\": \"vehicle-id-XYZ\",\n        \"licensePlate\"\
    : \"AB123CD\",\n        \"make\": \"Mercedes\",\n        \"model\": \"Citaro\"\n      }\n    ]\n \
    \ }\n]\n```\n\n**How to extract duties for a specific driver and build the desired table:**\n\nTo\
    \ create a table with columns `driverUuid`, `driverName`, `dutyId`, `blockId`, `vehicleId`, follow\
    \ these steps:\n\n**Note on Spare Types**: When the spare types feature flag is enabled, spare tasks\
    \ will include additional properties (`spareType`, `dutyType: \"spare\"`) and the `displayId` will\
    \ show the configured spare type name instead of the original display ID.\n\n1.  **Iterate through\
    \ the Depot Plans and Daily Assignments:**\n\n    - The API response is an array of depot plans. Iterate\
    \ through each depot object.\n    - Access the `assignments` array. For each `assignment` object (representing\
    \ a specific `date`), iterate through its `driverAssignments` array.\n\n2.  **Populate Driver and\
    \ Duty Information:**\n\n    - **`driverUuid`**: Directly available from `driverAssignment.driver`.\n\
    \    - **`driverName`**: Look up the `driverUuid` in the root `drivers` array (e.g., `drivers.find(d\
    \ => d.uuid === driverAssignment.driver)`) to retrieve `firstName` and `lastName`.\n    - **`dutyId`**:\
    \ The `driverAssignment.assignments` array contains one or more task IDs assigned to that driver.\
    \ Each of these is a `dutyId`.\n\n3.  **Identify Block(s) and Vehicle(s) for the Duty:**\n    - For\
    \ a given `dutyId` (task ID), find the corresponding object in the root `tasks` array.\n    - Iterate\
    \ through the `events` array of that task. An event within the duty will contain a `blockId`.\n  \
    \  - **From Block ID to Vehicle ID:**\n      - Go back to the `assignments` object for the current\
    \ `date`.\n      - Access its `vehicleAssignments` array.\n      - Find the `vehicleAssignment` object\
    \ where its `assignments` array includes your `blockId`.\n      - The `vehicle` property of that `vehicleAssignment`\
    \ object is the `vehicleId` you need for the table row.\n\n## Generate a List of Duties with Service\
    \ Trips\n\nThis use case demonstrates how to retrieve duties and a detailed list of all service trips\
    \ within each duty. This provides a granular view of an operational day.\n\n**Process:**\n\n1.  **Prepare\
    \ Your Request:**\n\n    - Specify the desired date range using `fromDate` and `toDate` parameters.\n\
    \    - Optionally, set `includeStops=true` if you need detailed stop information for each trip. Be\
    \ aware that enabling this can significantly increase response time and payload size.\n\n2.  **Make\
    \ a `GET` Request to the Operational Plan Endpoint:**\n    - Use the `/v2/operational-plan` API endpoint,\
    \ including the date range query parameters.\n\n**Example `GET` Request:**\n\n```http\nGET /v2/operational-plan?fromDate=2024-06-15&toDate=2024-06-15&includeStops=true\n\
    Authorization: <YOUR_API_TOKEN>\n```\n\n**Example JSON Response Snippet (Relevant sections):**\n\n\
    The `tasks` array contains the duty objects. The overall duty start/end times can be found in the\
    \ `summary` object (as minutes from midnight). Each duty contains an `events` array detailing the\
    \ activities within it.\n\n```json\n[\n  {\n    \"assignments\": [\n      {\n        \"date\": \"\
    2024-06-15\",\n        \"driverAssignments\": [\n          {\n            \"driver\": \"driver-uuid-456\"\
    ,\n            \"assignments\": [\"task-uuid-B\"]\n          }\n        ]\n      }\n    ],\n    \"\
    tasks\": [\n      {\n        \"id\": \"task-uuid-B\",\n        \"type\": \"duty\",\n        \"displayId\"\
    : \"Duty 700\",\n        \"summary\": {\n          \"type\": \"duty\",\n          \"startTime\": 420,\n\
    \          \"endTime\": 960\n        },\n        \"events\": [\n          {\n            \"uuid\"\
    : \"event-uuid-E\",\n            \"eventType\": \"deadhead\",\n            \"subType\": \"depot_pull_out\"\
    ,\n            \"startTime\": \"07:00:00\",\n            \"endTime\": \"07:30:00\"\n          },\n\
    \          {\n            \"uuid\": \"event-uuid-F\",\n            \"eventType\": \"service_trip\"\
    ,\n            \"startTime\": \"07:30:00\",\n            \"endTime\": \"08:15:00\",\n            \"\
    tripId\": \"service-trip-201\",\n            \"optibusRouteId\": \"route-R2\",\n            \"direction\"\
    : 1,\n            \"stops\": [\n              { \"id\": \"stop-1\", \"name\": \"Main St.\", \"time\"\
    : \"07:30:00\" },\n              { \"id\": \"stop-2\", \"name\": \"Oak Ave.\", \"time\": \"07:45:00\"\
    \ }\n            ]\n          },\n          {\n            \"uuid\": \"event-uuid-G\",\n         \
    \   \"eventType\": \"service_trip\",\n            \"startTime\": \"08:30:00\",\n            \"endTime\"\
    : \"09:15:00\",\n            \"tripId\": \"service-trip-202\",\n            \"optibusRouteId\": \"\
    route-R2\",\n            \"direction\": 2\n          }\n        ]\n      }\n    ]\n  }\n]\n```\n\n\
    **How to extract duties with service trips:**\n\n1.  **Identify Duties:**\n\n    - Iterate through\
    \ the top-level `tasks` array in the API response.\n    - A `task` object with `\"type\": \"duty\"\
    ` represents a duty.\n    - The date for the duty is found by cross-referencing `task.id` with the\
    \ `assignments` array to find the corresponding `date`.\n\n2.  **Extract Service Trips within each\
    \ Duty:**\n    - For each identified duty (`task` object), access its `events` array.\n    - **Service\
    \ Trips:** An event where `eventType` is `\"service_trip\"` represents a service trip. You can extract\
    \ `startTime`, `endTime`, `tripId`, `optibusRouteId`, `direction`, and any other relevant details\
    \ available directly on the event object.\n    - **Deadhead Events:** Events with `eventType: \"deadhead\"\
    ` represent non-service movements. You can filter these out or process them separately as needed.\n\
    \n## Retrieve Cancelled Duties for a Specific Day\n\nThis use case explains how to identify duties\
    \ (tasks) that have been explicitly cancelled for a given day. This is essential for managing daily\
    \ operations and reporting on changes.\n\n**Process:**\n\n1.  **Prepare Your Request:**\n\n    - Specify\
    \ the `fromDate` and `toDate` parameters to cover the specific day you are interested in. For a single\
    \ day, `fromDate` and `toDate` will be the same.\n\n2.  **Make a `GET` Request to the Operational\
    \ Plan Endpoint:**\n    - Use the `/v2/operational-plan` API endpoint with the desired date range.\n\
    \n**Example `GET` Request:**\n\n```http\nGET /v2/operational-plan?fromDate=2024-06-10&toDate=2024-06-10\n\
    Authorization: <YOUR_API_TOKEN>\n```\n\n**Example JSON Response Snippet (Relevant sections):**\n\n\
    The `assignments` array contains a `properties` sub-array. An entry with `disabled: true` directly\
    \ indicates a cancelled task.\n\n```json\n[\n  {\n    \"assignments\": [\n      {\n        \"date\"\
    : \"2024-06-10\",\n        \"driverAssignments\": [],\n        \"vehicleAssignments\": [],\n     \
    \   \"properties\": [\n          {\n            \"taskId\": \"task-uuid-cancelled-A\",\n         \
    \   \"disabled\": true,\n            \"cancellationReason\": {\n              \"reason\": \"Vehicle\
    \ Breakdown\",\n              \"reasonCode\": \"VEHICLE_BREAKDOWN\"\n            },\n            \"\
    assignmentType\": \"driverAssignment\"\n          },\n          {\n            \"taskId\": \"task-uuid-active-B\"\
    ,\n            \"disabled\": false,\n            \"assignmentType\": \"driverAssignment\"\n      \
    \    }\n        ]\n      }\n    ],\n    \"tasks\": [\n      {\n        \"id\": \"task-uuid-cancelled-A\"\
    ,\n        \"type\": \"duty\",\n        \"displayId\": \"Duty 900 C\",\n        \"summary\": { \"\
    type\": \"duty\", \"startTime\": 540, \"endTime\": 1080 },\n        \"events\": []\n      },\n   \
    \   {\n        \"id\": \"task-uuid-active-B\",\n        \"type\": \"duty\",\n        \"displayId\"\
    : \"Duty 700 A\",\n        \"summary\": { \"type\": \"duty\", \"startTime\": 420, \"endTime\": 900\
    \ },\n        \"events\": []\n      }\n    ]\n  }\n]\n```\n\n**How to get a list of duties for a certain\
    \ day which were cancelled:**\n\n1.  **Fetch Operational Plan:** Make a `GET` request to the `/v2/operational-plan`\
    \ endpoint for your desired `fromDate` and `toDate`.\n2.  **Access Assignment Properties:** Once you\
    \ receive the response, iterate through the `assignments` array. For each daily assignment object,\
    \ navigate to its `properties` array.\n3.  **Filter for Disabled Tasks:** Iterate through each object\
    \ within the `properties` array. Check the value of the `disabled` property: If `property.disabled`\
    \ is `true`, the `taskId` associated with this property represents a cancelled duty.\n4.  **Retrieve\
    \ Cancelled Duty (Task) Details:**\n    - For each `taskId` identified as `disabled: true`, you can\
    \ find the corresponding full duty object in the top-level `tasks` array (e.g., `tasks.find(t => t.id\
    \ === property.taskId)`).\n    - Optionally, you can also extract the `cancellationReason` object\
    \ from the `properties` entry for more context.\n"
- name: Custom Driver App Notification Action Guide
  description: "## 1. Overview\n\nThis guide provides technical instructions for integrating with the\
    \ Optibus Driver App's \"custom notification actions\" feature.\n\nCustom actions allow you to configure\
    \ interactive buttons that appear on specific notifications sent to drivers. When a driver taps a\
    \ button, it opens a web page that you host. This enables a variety of integrations, such as:\n\n\
    - Displaying a location on a map.\n- Linking to an external resource or document.\n- Building a form\
    \ to acknowledge a notification, which can be recorded in a separate IT system.\n\n### How It Works\n\
    \n1.  A driver receives a notification in the Optibus Driver App containing one or more custom action\
    \ buttons.\n2.  The driver taps a button.\n3.  The app opens the pre-configured URL in a web browser.\n\
    4.  The Optibus app automatically appends two query parameters to your URL: `optibusPayload` and `optibusSignature`.\n\
    \n## 2. Configuration\n\nThis feature is configured via the _Limit notifications visibility_ preference\
    \ in Optibus Operations. To enable and set up the custom action buttons, please contact your Optibus\
    \ Customer Success Manager for assistance. They will help you configure the button text, target URL,\
    \ and other parameters to suit your specific use case.\n\n## 3. Implementation Guide\n\nWhen a driver\
    \ activates a custom action, your web page will receive a URL containing two critical query parameters.\
    \ Any query parameters you originally included in the URL will also be preserved.\n\n| Parameter \
    \         | Description                                                                          \
    \                             |\n| :----------------- | :----------------------------------------------------------------------------------------------------------------\
    \ |\n| `optibusPayload`   | A URL-encoded, JSON-stringified object containing contextual data about\
    \ the notification and action.              |\n| `optibusSignature` | A Base64-encoded digital signature\
    \ of the `optibusPayload` string. Use this to verify the request's authenticity. |\n\n---\n\n### 3.1.\
    \ Parsing the `optibusPayload` Parameter\n\nThe `optibusPayload` contains all the contextual information\
    \ for your web page. To use it, you must first URL-decode the string and then parse it as a JSON object.\n\
    \n**JavaScript Example:**\n\n```javascript\n// The URL of the page opened by the Driver App.\nconst\
    \ url = new URL(window.location.href);\n\n// 1. Get the raw payload string from the URL's search parameters.\n\
    const rawPayload = url.searchParams.get(\"optibusPayload\");\n\n// 2. Parse the URL-encoded JSON string.\n\
    const payload = JSON.parse(rawPayload);\n\nconsole.log(payload);\n```\n\n#### Payload Schema\n\nThe\
    \ parsed `payload` object will conform to the following schema:\n\n```json\n{\n  \"customAction\"\
    : {\n    \"key\": \"<string>\"\n  },\n  \"notification\": {\n    \"id\": \"<uuid>\",\n    \"driverId\"\
    : \"<string>\",\n    \"type\": \"<string>\",\n    \"params\": {\n      // Schema is dependent on the\
    \ notification 'type'\n    }\n  },\n  \"payloadGeneratedAt\": \"2024-10-11T13:46:56.610Z\"\n}\n```\n\
    \n**Field Descriptions:**\n\n- `notification.id`: The unique UUID of the notification that triggered\
    \ the action.\n- `notification.driverId`: The ID of the driver who received the notification.\n- `notification.type`:\
    \ The type of notification (e.g., `assignTask`). The schema of the `params` object depends on this\
    \ value.\n- `notification.params`: An object containing data specific to the notification type. Contact\
    \ your Customer Success Manager for the exact schema for a given notification type.\n- `customAction.key`:\
    \ A custom string identifier you specify during the URL configuration.\n- `payloadGeneratedAt`: An\
    \ ISO 8601 timestamp indicating when the driver tapped the button.\n\n---\n\n### 3.2. Verifying the\
    \ `optibusSignature` (Recommended)\n\nThe `optibusSignature` parameter allows you to verify that the\
    \ request was genuinely initiated by the Optibus system and has not been tampered with. Verification\
    \ is optional but highly recommended for any security-sensitive application.\n\nThe signature is created\
    \ by signing the raw `optibusPayload` string (before JSON parsing) using the `RSA-SHA256` algorithm.\
    \ You can verify it using a public key provided by Optibus.\n\n> **Public Key**: You can obtain the\
    \ required public key from the Optibus [public key API endpoint](#tag/Driver-App-Notifications/operation/getPublicKey).\n\
    \n#### Signature Verification Example (Node.js)\n\nThis example demonstrates how to verify the signature\
    \ and check the payload's timestamp to prevent replay attacks.\n\n```javascript\nconst crypto = require(\"\
    node:crypto\");\n\n// Use the public key fetched from the aforementioned Optibus API endpoint.\nconst\
    \ publicKey = \"\";\n\n// Extract the parameters from the URL.\n// In a real application, you would\
    \ get this from the incoming request.\nconst url = new URL(\"https://your-service.com/action?...\"\
    );\nconst rawPayload = url.searchParams.get(\"optibusPayload\");\nconst signature = url.searchParams.get(\"\
    optibusSignature\");\n\n// 1. Verify the signature's authenticity.\nconst verifier = crypto.createVerify(\"\
    RSA-SHA256\");\nverifier.update(rawPayload);\nverifier.end();\n\nconst isVerified = verifier.verify(publicKey,\
    \ signature, \"base64\");\nif (!isVerified) {\n  throw new Error(\"Invalid signature. The request\
    \ is not authentic.\");\n}\n\n// 2. (Optional but Recommended) Check if the payload is recent to prevent\
    \ replay attacks.\nconst maxPayloadAge = 5 * 60 * 1000; // 5 minutes in milliseconds\nconst parsedPayload\
    \ = JSON.parse(rawPayload);\nconst payloadTimestamp = new Date(parsedPayload.payloadGeneratedAt).getTime();\n\
    \nif (Date.now() - payloadTimestamp > maxPayloadAge) {\n  throw new Error(\"Payload is too old. Possible\
    \ replay attack.\");\n}\n\n// If verification passes, you can proceed with your logic here.\nconsole.log(\"\
    Signature and timestamp are valid.\");\n```\n\n## 4. Example URL\n\nThe following is an example of\
    \ a complete URL your service might receive after a custom action is triggered.\n\n```\nhttps://www.optibus.com/?optibusPayload=%7B%22notification%22%3A%7B%22id%22%3A%22b82df1ce-6420-47a6-be06-52b97c9965c5%22%2C%22driverId%22%3A%2233774450%22%2C%22type%22%3A%22assignTask%22%2C%22params%22%3A%7B%22calendarDate%22%3A%222024-10-11%22%2C%22taskName%22%3A%5B%7B%22name%22%3A%224%22%2C%22type%22%3A%22duty%22%2C%22endTime%22%3A1476%2C%22startTime%22%3A920%7D%5D%7D%7D%2C%22customAction%22%3A%7B%22key%22%3A%22OPEN%22%7D%2C%22payloadGeneratedAt%22%3A%222024-10-11T14%3A57%3A49.872Z%22%7D&optibusSignature=arML2T%2B4zu345r1xT78wYbjMZf8VUAmWXylOQUNkGf7isj7KppV75JQURiYufQxwlKmp9qVbk8SMIO3iKHs2FcU0XylBhzpa9QhK4ewyE6SfEhEuZKF7IzkwuL%2B6hJS13Hkqli5IzJKIt0pewVZaBBEREzuqtgm7KQZCCvwoT4nvFnt9kPcSDhJ0jui4IKXfsmBIpdo6XrVgxz72Rgc5ugHlJB9ZmtZ95r%2FBN5ZbBqS%2FThxyaogkLbfcpuFAGuewN2VWFoMVDUU38k0UT3S%2Bb1ZG9bqaeaXRe9tyNJv9JurRCistIAuD%2F4ThgseoLuopb8scJqst8Dp%2FM1XlP0rMYA%3D%3D\n\
    ```\n"
- name: Authentication
  description: 'The Optibus Operations API requires authentication via a stable `API_KEY` sent in the
    HTTP request `Authorization` header in the form of `Authorization: API_KEY`.

    Additionally requests against our API expect the `X-Optibus-Api-Client` header to be set using your
    `ACCOUNT_NAME`.


    If you are considering programmatic access the Optibus Operations platform, please contact your Optibus
    Customer Success Manager who can provide the `API_KEY` and `ACCOUNT_NAME` above, as well as your account-specific
    `BASE_URL` for the API endpoints documented below.


    Example:


    ```

    CURL -H "Authorization:API_KEY" -H ''X-Optibus-Api-Client: API_USER'' https://BASE_URL/driver

    ```


    '
- name: Versioning
  description: "**We may in the future make changes to the Optibus Operations API described on this page.**\
    \ This could be to fix bugs, enhance the richness of information made available in existing endpoints,\
    \ or to introduce new API functionality via new endpoints.\n\nThe Optibus Operations team treats API\
    \ changes in the following way:\n\n- we follow [Semantic Versioning](https://semver.org/) for the\
    \ version number of the overall API as documented on this page. Individual endpoints may be provided\
    \ with versions indicated as prefix such as `/v{version}/{endpoint}`. These endpoint specific numbers\
    \ may lag behind the major version of the overall API, but will never exceed it.\n- we will NOT change\
    \ existing API endpoints in a breaking way suddently. Breaking changes in this sense would be to\n\
    \  - remove previously documented endpoints\n  - remove previously documented properties in responses\n\
    \  - change the type of documented properties in responses (e.g. number to string, or YYYY-MM-DD string\
    \ to proper ISOtime string)\n  - remove or change documented request parameters for endpoints\n  -\
    \ add new required request parameters to existing endpoints\n- we MAY without considering this a breaking\
    \ change\n  - add additional properties to response objects\n  - add additional optional request parameters\
    \ (e.g. new filtering options)\n  - add new endpoints\n\nIn case we do introduce breaking changes\
    \ to existing endpoints, this will happen in the following way:\n- we will add a new version of the\
    \ affected endpoint, prepended with a version prefix with an increased version number. E.g. if we\
    \ would make a breaking change to `{baseURL}/v1/driver`, we would introduce a new endpoint `{baseURL}/v2/driver`\
    \ with adjusted behavior\n- may deprecate the old endpoint. We will wait at least 3 months after announcing\
    \ such a change on this page before shutting down the deprecated endpoint\n- may consider the announcement\
    \ of deprecation of an endpoint as a major change to the overall API version (as indicated in the\
    \ title of this document) and increase the version number accordingly"
- name: Changelog
  description: "Below, we use the following icons to indicate the type of changes:\n\n- \U0001F41E Bugfix:\
    \ correcting API behavior to what was previously indicated. No breaking change\n- \U0001F31F Addition:\
    \ New properties, request filtering capabilities, or endpoints. No breaking change\n- \U0001F4A5 Breaking\
    \ change. This would typically result in us adding a new version of an endpoint prepended with an\
    \ increased `version` prefix such as `/v2/endpointName` to `/v3/endpointName`. See section [Versioning](#tag/Versioning).\n\
    \n### v2.8.19 - 2026-06-30 \U0001F31F\n\n- \U0001F31F `GET /v2/duty-stats-calculation-limit`: added\
    \ `tasksLimit` to the response — the maximum number of tasks a single `GET /v2/duty-stats` request\
    \ may ask for via the `taskIds` filter. Use it when `daysLimit` is `0` (a day too dense to fetch whole):\
    \ send one day per request (`fromDate` equal to `toDate`) with at most `tasksLimit` task UUIDs per\
    \ request. `tasksLimit` never exceeds 250, to keep the request URL within size limits. Both limits\
    \ are integers.\n- \U0001F31F `GET /v2/duty-stats`: the calculation-limit enforcement now matches\
    \ the two limits exactly. A request spanning more than `daysLimit` days returns HTTP 413 regardless\
    \ of task or driver filters. When `daysLimit` is `0`, a request passes only as a single day (`fromDate`\
    \ equal to `toDate`) with a `taskIds` filter of at most `tasksLimit` tasks — previously such dense\
    \ days could not be fetched at all.\n\n### v2.8.18 - 2026-06-25 \U0001F31F\n\n- \U0001F31F Event Webhooks:\
    \ added the `cancel_duty`, `reactivate_duty`, and `delete_duty` operational actions to the real-time\
    \ stream, emitted when a dispatcher cancels, reactivates, or deletes a duty. Each ships the full run\
    \ / run_assignment / run_events cascade with a uniform `entity_operation` - introducing the new `cancel`\
    \ and `reactivate` values alongside `create` / `update` / `delete`. A cancelled run may carry an optional\
    \ `cancellation_cause` (`{ cause_code, cause }`) when the dispatcher selected a reason. `blocks` and\
    \ `block_assignments` are empty for these actions (block-level reconciliation stays on the scheduled\
    \ feed).\n\n### v2.8.17 - 2026-06-16 \U0001F31F\n\n- \U0001F31F `GET /v2/drivers`: added the `customAttributes[<attributeId>]=value`\
    \ query parameter to filter drivers by custom attribute value. Repeat a key to match any of several\
    \ values (OR) for an attribute; listing several distinct attribute keys requires a driver to match\
    \ all of them (AND). NUMBER attributes are matched numerically (`20`, `20.0` and `20.00` are equivalent);\
    \ all other types are matched exactly and case-sensitively. Matching is against the value effective\
    \ on the date specified by `onDate` (or today's date if not provided). Unknown attribute ids match\
    \ no drivers.\n\n### v2.8.16 - 2026-06-15 \U0001F31F\n\n- \U0001F31F `GET /v1/drivers/volunteering-periods`:\
    \ new endpoint returning driver volunteering periods (periods where a driver is willing to volunteer\
    \ for extra work, e.g. on a rest day or for overtime). Supports optional filtering by driver IDs and\
    \ by date range (`fromDate`/`toDate`, matching periods that overlap the window), and is paginated\
    \ (100 periods per page). Each period's time range (`startTime`, `endTime`, `timePeriodCode`) is either\
    \ fully present or all `null`.\n\n### v2.8.15 - 2026-06-09 \U0001F31F\n\n- \U0001F31F `GET /v2/duty-stats`:\
    \ New endpoint returning per-task work-engine statistics for a date range, mirroring the duty side\
    \ panel in the Ops UI. Returns one row per `(date, task)` pair with the statistics configured under\
    \ the customer's `dutyFilter` preference. Supports filtering by depot IDs, driver IDs, task UUIDs,\
    \ and stat IDs. Exceeding the calculation cap returns HTTP 413 — use `GET /v2/duty-stats-calculation-limit`\
    \ to size the request.\n- \U0001F31F `GET /v2/duty-stats-calculation-limit`: New endpoint returning\
    \ the maximum number of days that fit safely in a single `GET /v2/duty-stats` request for a given\
    \ date range and depot scope. The limit is derived from the busiest observed day in the range.\n-\
    \ \U0001F31F `GET /v2/calculation-limit`: Added optional `mode` query parameter (`payroll` | `workEntities`)\
    \ to select the cost model used to compute the driver limit. The default mode is now `payroll`, which\
    \ accounts for payroll cycle boundaries and always yields a limit ≤ the `workEntities` limit — meaning\
    \ a caller that omits `mode` can never be told a higher limit than `/v2/payroll` will actually accept.\
    \ Pass `mode=workEntities` to get the exact-dates limit when calling `/v2/work-entities`.\n- \U0001F31F\
    \ `GET /v2/payroll`: The calculation limit check is now cycle-aware. When all configured payroll codes\
    \ map to daily work entities, the limit uses the exact requested date range (`ExactDates`). When any\
    \ payroll code maps to a weekly (or other non-daily) entity, the limit expands to the full payroll\
    \ cycle boundary (`FullCycle`). This aligns with the default behaviour of `GET /v2/calculation-limit`\
    \ and prevents the limit from being exceeded due to cycle expansion at query time.\n\n### v2.8.14\
    \ - 2026-05-29 \U0001F31F\n\n- \U0001F31F `POST /v1/tacho-activity`: Renamed from `POST /v1/ops/tacho-activity`\
    \ — the `/ops` prefix was unintended. The endpoint remains unstable and not yet available for use;\
    \ the previous path is no longer served.\n\n### v2.8.13 - 2026-05-26 \U0001F31F\n\n- \U0001F31F `POST\
    \ /v1/absences`: If any driver in the request would exceed the configured yearly `maxCap` for an absence\
    \ type, that driver's absence imports are blocked and the request is rejected with HTTP 422 `absenceTypeCapExceeded`.\
    \ Response details list the offending (driverId, absenceCode) pairs. Requires the `entitlementBanksDeductionOrder`\
    \ feature flag and the `absenceCapEnabled` Absences preference.\n- \U0001F31F `POST /v1/absences`:\
    \ The `skipBalanceValidation=true` query parameter now also opts out of the new `absenceTypeCapExceeded`\
    \ validation (single opt-out for all entitlement-driven validation). Previously this parameter only\
    \ skipped negative-balance checks.\n- \U0001F31F `POST /v1/drivers/absence-quotas-query`: added as\
    \ the preferred endpoint for absence quota configuration and aggregated usage, with request parameters\
    \ sent in the body to support larger payloads. The existing `GET /v1/drivers/absence-quotas` endpoint\
    \ remains available for compatibility but is now deprecated in the API docs; use POST for large request\
    \ parameters, especially large `simulate` payloads.\n\n### v2.8.12 - 2026-05-16 \U0001F31F\n\n- \U0001F31F\
    \ `GET /v2/signing-times`: new endpoint returning matched expected/actual sign-on and sign-off times\
    \ for drivers on a given operational date in a region. Supports filtering by driver IDs and is paginated\
    \ by driver (100 drivers per page). A driver appears in the response if their main or loaned region\
    \ is the requested region on the date, regardless of whether they have a calendar task; drivers without\
    \ any tasks or signings appear with `signingTimes: []`, and orphaned signings (for example, an actual\
    \ sign-on left behind after a previously-assigned task was unassigned) surface as entries with `orphaned:\
    \ true`.\n\n### v2.8.11 - 2026-05-15 \U0001F31F\n\n- \U0001F31F `POST /v1/ops/tacho-activity`: New\
    \ endpoint to ingest normalized Tachograph activity data. Accepts 1-5000 activities per request. Listed\
    \ under the new \"Data Ingestion\" section. **⚠️ Unstable — not yet available for use. The endpoint\
    \ currently validates payloads but does not persist any data, and the request/response shape may still\
    \ change without notice. Published for design review and integration planning only.**\n\n### v2.8.10\
    \ - 2026-05-13 \U0001F31F\n\n- \U0001F31F `GET /v1/drivers/absence-quotas`: new endpoint to read absence\
    \ quota configuration and aggregated usage for a date range, with optional `depotId` and `unitIds`\
    \ scope. OpenAPI documentation describes how **unit-level** quota rows (`depotQuota.unitQuotas`) drive\
    \ limits and totals—the optional depot-level `depotQuota.quota` is not the active cap when unit rows\
    \ are configured.\n\n### v2.8.9 - 2026-04-22 \U0001F31F\n\n- \U0001F31F `PUT /v1/vehicles`: Added\
    \ optional `mainRegionPeriod` on each request item (same shape as `GET /v1/vehicles`). When it differs\
    \ from the vehicle's current assignment, a new main region period starts today (customer timezone).\
    \ If a main period already starts today, it is overwritten and an `overwriteMainRegionPeriodEntry`\
    \ warning is returned. Omitting the field leaves region/depot unchanged.\n- \U0001F31F `PUT /v1/vehicles`:\
    \ Success responses may include a `warnings` array for non-fatal side effects (`overwriteMainRegionPeriodEntry`,\
    \ `overwriteCustomAttributeEntry` when a same-day custom attribute entry is replaced). The property\
    \ is omitted when there are no warnings.\n- \U0001F31F `PUT /v2/drivers`: Success responses may include\
    \ `warnings` for `overwriteCustomAttributeEntry` when a same-day custom attribute entry is replaced;\
    \ the property is omitted when there are no warnings (same wire shape as `PUT /v1/vehicles`).\n\n\
    ### v2.8.8 - 2026-04-16 \U0001F41E\n\n- \U0001F41E `GET /v2/operational-plan`: Fixed block events\
    \ containing `RosterDutyEventReference` entries whose `dutyId` does not match any task in the response.\
    \ Such orphaned references are now stripped from the block's events array. Note: a block whose events\
    \ were entirely orphaned references will now be returned with an empty `events` array; the block itself\
    \ (including its vehicle and source metadata) is still included.\n\n### v2.8.7 - 2026-04-01 \U0001F31F\
    \n\n- \U0001F31F `GET /v2/operational-plan`: Added `includeActualSigningTimes` query parameter. When\
    \ set to `true`, assignment properties include `signOnActual` and `signOffActual` attributes containing\
    \ the actual signing times as ISO 8601 datetime strings in the customer's operational timezone (no\
    \ UTC offset), or `null` if the driver has not yet signed. Defaults to `false` for backwards compatibility.\n\
    \n### v2.8.6 - 2026-03-25 \U0001F31F\n\n- \U0001F31F `GET /v2/stats`: New endpoint to retrieve driver\
    \ statistics (normal, yearly, accumulated) for a specified date. Supports filtering by driver IDs,\
    \ depot ID, and stat IDs. Normal stats are calculated via the work engine, while yearly and accumulated\
    \ stats are fetched from the yearly cache.\n\n### v2.8.5 - 2026-03-12 \U0001F31F\n\n- \U0001F31F `GET\
    \ /roster`: Standby and Spare tasks now included in `tasks[]`. Previously only Duty tasks were returned,\
    \ leaving `taskId` references in `assignmentsInfo` unresolvable for non-Duty assignments.\n\n### v2.8.4\
    \ - 2026-03-11 \U0001F31F\n\n- \U0001F31F `GET /v2/operational-plan`: Added `excludeCancelledTasks`\
    \ query parameter. When set to `true`, cancelled (disabled) tasks are excluded from `driverAssignments`,\
    \ `vehicleAssignments`, and `plannedAssignments`. Defaults to `false` for backwards compatibility.\n\
    - \U0001F31F `GET /v2/operational-plan`: Added `cancelled` property alias on assignment properties\
    \ as a clearer alternative to `disabled`.\n\n### v2.8.3 - 2026-03-10 \U0001F31F\n\n- \U0001F31F Improved\
    \ API documentation: added summary titles to all external API operations and restored stable operation\
    \ IDs for consistency with existing API consumers.\n- \U0001F31F `GET /v1/operational-plan` and `GET\
    \ /v1/operational-plan/{depotId}` are now listed under the deprecated section in the API docs (use\
    \ `GET /v2/operational-plan` instead).\n\n### v2.8.2 - 2026-02-02 \U0001F31F\U0001F41E\n\n- \U0001F31F\
    \ Improved detail for many driver- and vehicle-related endpoints in the API documentation.\n- \U0001F41E\
    \ `POST /v2/drivers`: fix bug where response status code when trying to create a driver with an ID\
    \ that already exists was 422 instead of 409\n- \U0001F41E `POST /v1/vehicles`: fix bug where response\
    \ status code when trying to create a vehicle with an ID that already exists was 422 instead of 409\n\
    - \U0001F41E Improved consistency of pagination behaviour across multiple recently added endpoints.\
    \ Requests for a page number that is out of range now return a 404 error response. Additionally, the\
    \ `totalPages` value now behaves consistently across all these endpoints when there are zero results\
    \ (some endpoints returned 0 total pages and some returned 1 - now all will return 1 in this scenario).\n\
    \  - `GET /v2/drivers`\n  - `GET /v2/drivers/absences`\n  - `GET /v2/drivers/custom-attributes`\n\
    \  - `GET /v2/drivers/employment-periods`\n  - `GET /v1/vehicles`\n  - `GET /v1/vehicles/custom-attributes`\n\
    \  - `GET /v1/vehicles/downtimes`\n\n### v2.8.1 - 2026-02-02 \U0001F31F\n\n- \U0001F41E `GET /v1/vehicles/downtimes`:\
    \ fix bug where some values incorrectly returned null instead of being undefined, contrary to the\
    \ behaviour stated in the API documentation.\n\n### v2.8.0 - 2026-01-30 \U0001F31F\n\n- \U0001F31F\
    \ `GET /v2/drivers/custom-attributes`: new endpoint to query driver custom attributes with entry IDs\
    \ for synchronization with third party systems. Supports filtering by driver IDs, attribute IDs, and\
    \ date range. Results are paginated (100 drivers per page) and sorted by driver ID, attribute ID,\
    \ and start date.\n- \U0001F31F `PUT /v2/drivers/custom-attributes`: new endpoint to create/update\
    \ driver custom attribute entries with entry IDs for synchronization with third party systems.\n-\
    \ \U0001F4A5 `GET /v2/driver-attributes`: deprecated in favor of `GET /v2/drivers/custom-attributes`.\
    \ The new endpoint provides entry IDs, improved pagination, and better filtering capabilities.\n\n\
    ### v2.7.2 - 2026-01-30 \U0001F31F\n\n- \U0001F31F `GET /v2/operational-plan`: Added `taskDisplayIds`\
    \ query parameter to filter tasks by display ID. Filtering cascades to related duty assignments, blocks\
    \ with task events, and vehicle assignments.\n\n### v2.7.1 - 2026-01-26 \U0001F31F\n\n- \U0001F31F\
    \ `PATCH /private_hires/order/{orderId}`: Support deletion of a private hire order and all its associated\
    \ resources, such as tasks and blocks.\n\n### v2.7.0 - 2026-01-15 \U0001F31F\n\n- \U0001F31F `POST\
    \ /v2/drivers`: new endpoint to create drivers\n- \U0001F31F `PUT /v2/drivers`: new endpoint to update\
    \ drivers\n- \U0001F41E `POST /v1/vehicles`: fix bug where response status on creating new vehicles\
    \ was 200 instead of 201\n\n### v2.6.1 - 2026-01-14 \U0001F31F\n\n- \U0001F31F Fixed typing bug as\
    \ `originDepot` and `destinationDepot` are sometimes undefined in duty event summaries across multiple\
    \ endpoints. Despite this they were typed as required. Now these fields are correctly typed as optional.\
    \ Affects the following endpoints:\n  - `GET /v1/operational-plan`\n  - `GET /v2/operational-plan`\n\
    \  - `GET /v1/calendar`\n  - `GET /v1/calendar/planned-assignments`\n\n### v2.6.0 - 2026-01-12 \U0001F31F\
    \n\n- \U0001F31F `GET /v2/drivers`: new endpoint to fetch paginated driver information with advanced\
    \ filtering capabilities. Supports filtering by driver IDs, region names, employment status, and date.\
    \ Results are sorted by driver ID and paginated (100 results per page).\n- \U0001F4A5 `GET /driver`:\
    \ deprecated in favor of `GET /v2/drivers`. The new endpoint provides improved filtering, pagination,\
    \ and date-based filtering capabilities.\n\n### v2.5.0 - 2025-12-28 \U0001F31F\n\n- \U0001F31F `GET\
    \ /v2/drivers/employment-periods`: new paginated endpoint to query driver employment periods. Supports\
    \ filtering by driver IDs and date range. Returns up to 100 results per page, sorted by driver ID,\
    \ start date, and end date.\n\n### v2.4.0 - 2025-12-22 \U0001F31F\n\n- \U0001F31F `GET /v2/drivers/absences`:\
    \ new paginated endpoint to query driver absences. Supports filtering by driver IDs, absence codes,\
    \ and date range. Returns up to 100 results per page, sorted by driver ID, start date, start time,\
    \ end date, and end time.\n\n### v2.3.25 - 2025-12-29 \U0001F31F\n\n- \U0001F31F `PUT /v1/vehicles/custom-attributes`:\
    \ new endpoint to create and update vehicle custom attributes.\n\n### v2.3.24 - 2025-12-24 \U0001F31F\
    \n\n- \U0001F31F `POST /v1/absences`: Added balance validation feature. When the `entitlementBanksEffectiveDate`\
    \ feature flag is enabled, the API validates that absences do not cause negative balance violations\
    \ for entitlement banks that do not allow negative balances. If violations are detected, the API returns\
    \ HTTP 422 with details about which drivers have violations and which banks are affected.\n  - Added\
    \ optional `skipBalanceValidation` query parameter (defaults to false). When set to \"true\", skips\
    \ balance validation.\n  - The HTTP 422 error can only occur when ALL of the following conditions\
    \ are met:\n    1. The `entitlementBanksEffectiveDate` feature flag is enabled\n    2. Entitlement\
    \ banks are configured and do NOT allow negative balances\n    3. The driver has entitlements\n  \
    \  4. The absence is connected to the bank (by absence type)\n    5. The driver would violate the\
    \ balance constraints (would cause negative balance)\n    6. The `skipBalanceValidation` query parameter\
    \ is NOT set to \"true\" (validation is enabled by default)\n\n### v2.3.23 - 2025-12-11 \U0001F31F\
    \n\n- \U0001F31F `GET /v1/vehicles/custom-attributes`: new endpoint to fetch vehicle custom attributes.\n\
    \n### v2.3.22 - 2025-12-03 \U0001F31F\n\n- \U0001F31F `POST /v1/drivers/employment-periods`: new endpoint\
    \ to create driver employment periods.\n- \U0001F31F `PUT /v1/drivers/employment-periods/{periodId}`:\
    \ new endpoint to update driver employment periods by ID.\n\n### v2.3.21 - 2025-12-02 \U0001F31F\n\
    \n- \U0001F31F `PUT /v1/vehicles/downtimes`: new endpoint to create or update vehicle downtimes\n\n\
    ### v2.3.20 - 2025-11-28 \U0001F41E\n\n- \U0001F41E `POST /v1/absences`: fix an issue where modifying\
    \ the dates of an existing absence would sometimes be blocked by an incorrect validation error.\n\n\
    ### v2.3.19 - 2025-11-20 \U0001F41E\n\n- \U0001F41E `POST /v1/drivers`: fix bug where using `regionName`\
    \ field returned validation error instead of accepting it\n\n### v2.3.18 - 2025-11-19 \U0001F31F\n\
    \n- \U0001F31F `GET /v1/vehicles/downtimes`: fixes a couple of minor property naming issues with the\
    \ response body. This is a non-breaking change as the API endpoint itself was not released yet at\
    \ the time of the fix.\n\n### v2.3.17 - 2025-11-13 \U0001F31F\n\n- \U0001F31F `PUT /v1/vehicles`:\
    \ new endpoint to update vehicles.\n\n### v2.3.16 - 2025-11-03 \U0001F31F\n\n- \U0001F31F `GET /v1/vehicles/downtimes`:\
    \ new endpoint to fetch vehicle downtimes with filtering and pagination.\n\n### v2.3.15 - 2025-10-30\
    \ \U0001F31F\n\n- \U0001F31F `GET /v2/operational-plan`: Added `lastAssignedDriverId` field to assignment\
    \ properties in response.\n\n### v2.3.14 - 2025-10-29 \U0001F31F\n\n- \U0001F31F `POST /v1/vehicles`:\
    \ new endpoint to create vehicles.\n\n### v2.3.13 - 2025-10-13 \U0001F31F\n\n- \U0001F31F `GET /v1/vehicles`:\
    \ new endpoint to fetch a list of vehicles.\n\n### v2.3.12 - 2025-10-09\n\n- \U0001F31F Calendar external\
    \ APIs spare types support: Enhanced calendar and operational-plan endpoints to include spare types\
    \ configuration when the feature flag is enabled. Spare tasks now display with proper type names and\
    \ additional metadata including start/end times and spare type codes.\n  Affected endpoints:\n  -\
    \ `GET /v1/calendar/{depotId}`\n  - `GET /v1/calendar-planned-assignments/{depotId}`\n  - `GET /v1/operational-plan/{depotId}`\n\
    \  - `GET /v1/operational-plan`, `GET /v2/operational-plan`\n\n### v2.3.11 - 2025-10-02\n\n- \U0001F31F\
    \ `GET /v1/preferences/absence-types`: new endpoint to fetch a list configured absence types.\n\n\
    ### v2.3.10 - 2025-08-18 \U0001F31F\n\n- \U0001F31F `GET /v1/driver-day-labels`: new endpoint to fetch\
    \ a list of labels applied for drivers within a given date range.\n\n### v2.3.9 - 2025-08-06 \U0001F41E\
    \U0001F31F\n\n- \U0001F41E `POST /v1/drivers`: fix API documentation inconsistency where `note` field\
    \ was documented as supported but was actually rejected by the API\n- \U0001F31F `POST /v1/drivers`:\
    \ add new clearly named fields with deprecation of confusing legacy field names:\n  - Added `regionName`\
    \ field (use instead of deprecated `depot` field)\n  - Added `groupName` field (use instead of deprecated\
    \ `group` field)\n  - Added `depotName` field (use instead of deprecated `opUnitId` field)\n  - Legacy\
    \ fields remain supported for backward compatibility\n\n**Note**: These changes are non-breaking because\
    \ the `note` field was never functional, and all other changes only add new fields while maintaining\
    \ full backward compatibility with existing field names.\n\n### v2.3.8 - 2025-05-23 \U0001F41E\n\n\
    - \U0001F41E `GET /v1/operational-plan/{depotId}`, `GET /v1/operational-plan`, `GET /v2/operational-plan`:\
    \ fix bug in response body where `assignments.properties.cancellationReason` was under certain conditions\
    \ returned as a string instead of as an object\n\n### v2.3.7 - 2025-03-18 \U0001F31F\n\n- \U0001F31F\
    \ `POST /v1/drivers`: add support for custom attributes\n\n### v2.3.6 - 2024-10-20 \U0001F31F\U0001F41E\
    \n\n- \U0001F31F new `/v1/preferences/holidays` endpoint added\n\n### v2.3.5 - 2024-09-16 \U0001F31F\
    \U0001F41E\n\n- Apidoc improvements\n  - \U0001F41E fix wrongly described endpoint of `/v1/regions`\
    \ (was incorrectly specified as `/region` in v2.3.4)\n\n### v2.3.4 - 2024-08-27 \U0001F31F\n\n- \U0001F31F\
    \ Added new endpoint `/v1/regions`\n\n### v2.3.3 - 2024-08-26 \U0001F31F\n\n- \U0001F31F `/group`\
    \ endpoint now returns `regionUuid` field, which is an alias of deprecated `depot` field\n- \U0001F31F\
    \ `/group` endpoint now returns additional `regionName` field\n\n### v2.3.2 - 2024-07-28 \U0001F31F\
    \n\n\U0001F31F Added the optibusTimeplanId field to the optibus Ids object within tasks and blocks\n\
    \n### v2.3.1 - 2024-07-15 \U0001F31F\n\n**Op Units in assignments** - we are introducing the op unit\
    \ in the operational plan. in V1 and V2, the naming of depots remains unchanged although for some\
    \ customers this would be considered a region. Within these customers, the lower level division is\
    \ called an operational unit (opUnit). In future versions, \"depots\" would be renamed to \"region\"\
    , and units would be renamed to \"depot\".\n\n- \U0001F31F Addition: Op Units in the operational calendar\
    \ assignment\n  - in both V1/V2, Op Unit Uuid now appears in the properties of each assignment\n \
    \ - in V2 only, the full list of op units is available at the region level\n\n### v2.3.0 - 2024-07-03\
    \ \U0001F31F\n\n**Introducing support for private hire endpoints**\n\n- `POST /private_hires/order`:\
    \ Creation of the private hire order and trips associated to it.\n- `GET /private_hires/order/{orderId}/info`:\
    \ Retrieval of the private hire order, the trips associated and the driver/vehicle assignments, besides\
    \ other useful information.\n- `PATCH /private_hires/order/{orderId}`: Modification of private hire\
    \ order status.\n- `PATCH /private_hires/order/{orderId}/trips`: Modification of trips associated\
    \ to a private hire order.\n\n### v2.2.1 - 2024-07-02 \U0001F31F\n\n- \U0001F31F Added a new optional\
    \ parameter 'includeUnassigned' to 'v1/operational-plan' and 'v2/operational-plan'. In conjunction\
    \ with supplying driver ids, this would instruct the endpoint to return unassigned tasks as well as\
    \ assigned tasks according to the driver filter.\n\n### v2.2.0 - 2024-03-10 \U0001F31F\n\n**Adjustment\
    \ to operational-plan endpoints**. Additional properties were added, and some additional aliases introduced\
    \ for a more coherent naming structure. This is intended to ease a transition from the deprecated\
    \ end point `v1/operational-plan` to `v2/operational-plan` (OPS-8538). While there are breaking changes\
    \ in `v2/operational-plan`, there are no active users at this endpoint currently yet, so we are treating\
    \ it as a minor version upgrade from `2.1.0` to `2.2.0`\n\n- \U0001F31F **Additions to `v1/operational-plan`.**\
    \ On each event:\n  - `eventId` has been added as an alias for the existing `id` property\n  - `eventType`\
    \ has been added as an alias for the existing `type` property\n  - `noteText` has been added\n  -\
    \ `reinforcedTripReference` has been added to reinforcement events\n  - `splitTripReference` has been\
    \ added the parts of trips that were split\n  - More properties have been typed on `eventJsonData`,\
    \ these vary per `eventType`.\n    - `blockId` has been added as an alias for the existing `vehicleId`\n\
    \    - Each event type is now more strongly typed so it should be clearer what properties exist on\
    \ what events.\n- \U0001F4A5 **Additions and changes to `v2/operational-plan`.** On each event:\n\
    \  - all v1 changes described above, plus:\n  - `type` has been removed and replaced by `eventType`\n\
    \  - `id` has been removed and replaced by `uuid`\n  - `eventJsonData` has been removed and all properties\
    \ that were inside this object are now on the event level\n\n### v2.1.0 - 2024-02-12 \U0001F31F\n\n\
    In `v1/operational-plan` and `v2/operational-plan`\n\n- **Additional source ids for tasks and blocks**\n\
    \  added Optibus IDs to tasks and blocks (OPS-8855)\n\n  - The properties are contained within a new\
    \ object called `optibusIds` on each task and block as follows\n    `export type OptibusIds = { optibusRosterId:\
    \ string; optibusRosterDatasetId: string; optibusScheduleId: string; };`\n    It is important to document\
    \ that tasks and blocks and days off that have been created inside Ops will NOT have these IDs. Therefore,\
    \ we are adding additional properties called: `source` and `wasModifiedInOperations`\n    - If the\
    \ `source` is “scheduling“:\n      - `optibusIds` will exist\n      - `wasModifiedInOperations` will\
    \ exist. True, if the task has been modified in anyway (excluding cancellations) else, False.\n  \
    \  - If the `source` is “operations“:\n      - `optibusIds` will NOT exist\n      - `wasModifiedInOperations`\
    \ will NOT exist.\n\n- **Adding dutyType to certain tasks**\n  added dutyType to the task, where dutyType\
    \ is a property that comes from Rosters/Schedules imported into Optibus Operations from Optibus Planning/Scheduling/Rostering\
    \ (OPS-8877)\n\n### v2.0.0 - 2024-01-29 \U0001F4A5\n\nChanges in this release do not contain breaking\
    \ changes to existing endpoints, but we are deprecating endpoint `v1/operational-plan` by 2024-06-30\
    \ in favor of `v2/operational-plan`, therefore marking this as a major release, increasing overall\
    \ API version from `1.3.0` to `2.0.0`:\n\n- \U0001F41E A bug was fixed where some tasks were not getting\
    \ filtered when using the driver filter (OPS-8280)\n- \U0001F4A5 **New `v2/operational-plan` endpoint**.\
    \ (OPS-6125) which contains a number of breaking changes if switching from `v1/operational-plan`.\
    \ Note that `v1/operational-plan` is still available, but will be deprecated by 2024-06-30:\n  - \U0001F4A5\
    \ Removed query params: `assignedOnly`, `vehicleIds`\n  - \U0001F4A5 `depotId` is no longer a path\
    \ parameter, it has been replaced by query param `depotUuids` which is now a list\n  - \U0001F4A5\
    \ `driverIds` query parameter is now called `driverUuids`\n  - \U0001F4A5 `from` query parameter is\
    \ now called `fromDate`\n  - \U0001F4A5 `to` query parameter is now called `toDate`\n  - \U0001F4A5\
    \ Response is now a list where each item is a depot. Each item now has the properties `depotUuid`\
    \ and `depotName` alongside the previous operational plan properties.\n  - \U0001F4A5 Failure to fetch\
    \ a plan for a depot will fail the whole request.\n  - \U0001F4A5 If one or more of the requested\
    \ depots is not found then return a 404 and an error which includes the list of missing depots (OPS-8707)\n\
    \  - \U0001F4A5 The end point to retrieve a single depot (ie `v2/operational-plan/{depotId}`) has\
    \ been removed. Instead their is only the `v2/operational-plan` endpoint and specific depots can be\
    \ requested using a `depotUuids` query parameter on the request.\n  - \U0001F4A5 The block/task `summary`\
    \ is removed in v2 (OPS-8757). Therefore:\n    - `destination.originStop` and `destination.originDepot`\
    \ are completely removed in `v2/operational-plan`\n    - `originStopName`, `originStopId`, `originStopLabel`,\
    \ `originDepotName`, `originDepotId` and `originDepotLabel` (and the equivalent for destination) are\
    \ moved up to the task/block level.\n- **Stops Properties**\n  - \U0001F31F in `v1/operational-plan/{depotId}`\
    \ (and `v2/operational-plan`), added `originStopName`, `originStopId`, `originStopLabel`, `originDepotName`,\
    \ `originDepotId` and `originDepotLabel` to the duty and block `summary` (and the equivalent for destination)\
    \ (OPS-8539)\n"
