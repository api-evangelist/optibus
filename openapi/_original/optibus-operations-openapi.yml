      description: '### Creation of a private hire order with one or more trips


        This endpoint operates on eventual consistency. This means the private hire order is validated
        and enqueued for processing which is confirmed by a http 202 status response.

        The actual processing happens asynchronously and typically takes a few seconds. To verify the
        order was successfully added, use the `GetPrivateHireOrder` endpoint below specifying the the
        `orderId` you used in this request.


        Private hire orders and trips should be unique by `orderId`, `taskId` and `date` respectively
        in the system.


        Once the order is created, resources to fulfill the trips, such as drivers and vehicles, can be
        only assigned through the Optibus OPS platform.


        An order can be created directly with a status ''confirmed'' or the status of an order can be
        updated using the endpoint `PATCH /private_hires/order/{orderId}`.

        By default on creation, if there''s no status being set, the order is being consider virtually
        as `pending`.


        #### Multi-day trips:


        Multi-day trips must be divided into individual trips per operational day. Trips can commence
        as early as `00:00` and extend up to a maximum of `36:00` local time, meaning trips can conclude
        as late as `12:00` noon the following day.

        Use cases that require trips to start and finish in different time zones are currently not supported.'
      summary: Create private hire order
      tags:
      - Private Hires
      security:
      - api_key: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostPrivateHireOrderRequest'
  /private_hires/order/{orderId}/info:
    get:
      operationId: GetPrivateHireOrder
      responses:
        '200':
          description: Private hire order and trips were successfully fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPrivateHireOrderResponse'
        '404':
          description: Order does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPrivateHireOrderResponse'
              examples:
                Example 1:
                  value:
                    errors:
                    - type: orderNonExistent
                      message: Private hire order doesn't exist
                      details:
                        orderId: non-existent-order-id
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateHireServerErrorResponse'
              examples:
                Example 1:
                  value:
                    errors:
                    - type: serverError
                      message: serverError
      description: '### Get information about a private hire order and its trips


        As details of a private hire order and its trips can be modified in the OPS platform, external
        parties can use this endpoint to get the current state and details of a specific order, its trips,
        as well as the vehicle and driver resources associated.


        #### Getting updates


        Currently there''s no support of a pushing mechanism in order to notify API consumers when something
        changes in resources that belong to a private hire order.

        As an alternative, until the push mechanism is implemented, this endpoint can be used following
        a polling strategy in order to identify changes that happen in a private hire order and the trips
        that belong to it.'
      summary: Fetch private hire order
      tags:
      - Private Hires
      security:
      - api_key: []
      parameters:
      - description: External identifier of a private hire order that should be unique within the system
        in: path
        name: orderId
        required: true
        schema:
          type: string
  /private_hires/order/{orderId}:
    patch:
      operationId: PatchPrivateHireOrder
      responses:
        '202':
          description: Private hire order status modification has been successfully enqueued for processing
        '400':
          description: Invalid request for updating an order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchPrivateHireOrderResponse'
              examples:
                Example 1:
                  value:
                    errors:
                    - type: orderAlreadyConfirmed
                      message: Private hire order has been already confirmed
                      details:
                        orderId: '123'
        '404':
          description: Order does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchPrivateHireOrderNotExistResponse'
              examples:
                Example 1:
                  value:
                    errors:
                    - type: orderNonExistent
                      message: Private hire order doesn't exist
                      details:
                        orderId: '123'
        '409':
          description: The request cannot be processed because events created from the web application
            are still being processed sequentially
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictProcessingRequestErrorResponse'
              examples:
                Example 1:
                  value:
                    errors:
                    - type: conflictProcessingRequest
                      message: The request cannot be processed right now, because the system is currently
                        sequentially processing other requests received briefly ago. Please wait and try
                        again in a few seconds.
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateHireServerErrorResponse'
              examples:
                Example 1:
                  value:
                    errors:
                    - type: serverError
                      message: serverError
      description: '### Update a private hire order status


        - `confirmed`: status to determine that the order has been paid by the hiring entity.

        In the OPS Optibus platform, when a trip has any driver or vehicle associated to a confirmed order,
        a warning message will be displayed to inform the dispatchers about this fact.

        - `cancelled`: status to cancel the order, freeing up resources associated to trips belonging
        to the order, such as drivers and vehicles.'
      summary: Update private hire order
      tags:
      - Private Hires
      security:
      - api_key: []
      parameters:
      - description: External identifier of a private hire order that should be unique within the system
        in: path
