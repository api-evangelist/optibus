        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPrivateHireOrderBodyRequest'
  /private_hires/order/{orderId}/trips:
    patch:
      operationId: PatchPrivateHireOrderTrips
      responses:
        '202':
          description: Request to either cancel or update private hire tasks has passed validations and
            has been enqueued for processing
          content:
            application/json:
              schema:
                anyOf:
                - {}
                - $ref: '#/components/schemas/PrivateHireWarningResponse'
        '400':
          description: Invalid request for upading an order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchPrivateHireOrderTripsBadRequestErrorResponse'
              examples:
                Example 1:
                  value:
                    errors:
                    - type: updatePrivateHireTripRegionNotAllowed
                      message: We currently don't allow to change the depot.
                      details:
                        currentRegionName: regionName1
                        currentDepotName: depotName1
                        newRegionName: regionName2
                        newDepotName: depotName2
        '404':
          description: Private hire order or trip does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatchPrivateHireOrderTripsNotFoundErrorResponse'
              examples:
                Example 1:
                  value:
                    errors:
                    - type: privateHireTripNotFound
                      message: We couldn't find a trip whose 'task-id-1'
                      details:
                        taskId: task-id-1
                        availableTaskIds:
                        - task-id-2
                        - task-id-3
        '409':
          description: The request cannot be processed because events created from the web application
            are still being processed sequentially
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictProcessingRequestErrorResponse'
              examples:
                Example 1:
                  value:
                    errors:
                    - type: conflictProcessingRequest
                      message: The request cannot be processed right now, because the system is currently
                        sequentially processing other requests received briefly ago. Please wait and try
                        again in a few seconds.
        '500':
          description: Server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateHireServerErrorResponse'
              examples:
                Example 1:
                  value:
                    errors:
                    - type: serverError
                      message: serverError
      description: '### Update or cancel private hire tasks of an order


        One or more private hire tasks can be updated/cancelled in the same request. Only send the private
        hire tasks that are meant to be updated or cancel, if tasks don''t need to be modified, refrain
        to include them in the request.

        Updates for a subset of private hire tasks won''t be supported, the request should be successful
        for all the intended private hire trips included in the request.



        #### Splitting tasks in Optibus OPS platform

        The private hire attribute `taskId` and `date` define the uniqueness of a task and is what''s
        being used to find the private hire task to be updated or cancelled.

        In case the private hire is being updated, in certain cases they will be deleted and recreated,
        changing the event IDs. So in case these IDs

        are being consumed in any way, it''s something to take into consideration.


        #### Updates with unassign

        When updating the ''date'' or times of the events, the driver and vehicle will be automatically
        unassign, because the API doesn''t account

        for potential overlaps or regulation compliance violations, unlike the OPS web client, for drivers
        and vehicles.


        Dispatchers can split/cut these trips (a.k.a. driver duties), creating 2 trips or more. This action
        causes as a side effect, the renaming of the original value for the attribute `taskId`.

        As an example, if an original private hire trip had the attribute `taskId` as the value `task-display-id`,
        after a dispatcher splits the trip in the OPS Optibus platform,

        it will create 2 trips whose `taskIds` values will be `task-display-id (1/2)` and `task-display-id
        (2/2)`.


        #### Supported update use cases for private hire trips:

        - Cancellation

        - Events addition or removal

        - Modification of `startTime` or/and `endTime` in an event (sub-trip)

        - Update of the `date`


        **Note**: At this moment, all the supported modifications will free up all the vehicles and drivers
        associated to the private hire trip, if there were any, given that it will cause a risk

        to violate regulation compliance rules, which are currently computed in the Optibus OPS web application.


        If there''s a modification that''s not supported, the response status code returned will be a
        400 malformed request, with an informative error that will point out that the change is not supported.'
      summary: Update private hire order trips
      tags:
      - Private Hires
      security:
      - api_key: []
      parameters:
      - description: External identifier of a private hire order that should be unique within the system
        in: path
        name: orderId
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchPrivateHireTripsBodyRequest'
