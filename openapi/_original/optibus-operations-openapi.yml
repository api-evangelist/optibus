      responses:
        '200':
          description: Absence quotas and usage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAbsenceQuotasResponse'
        '400':
          description: 'Possible error types: `Invalid request schema` (e.g. missing `from`/`to` or invalid
            date format)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaValidationErrorResponse'
      description: "Returns configured **absence quota** definitions for the customer together with **aggregated\
        \ usage**\n(unique drivers per day / per week, by absence type where applicable) for the requested\
        \ calendar window.\n\nQuotas and limits come from Ops preferences (same configuration as the internal\
        \ planner). Usage is derived\nfrom all drivers' absences and depot/operational-unit assignments\
        \ in the widened date range needed for\nweekly quota windows.\n\n**Request scope**\n- `from` /\
        \ `to` (inclusive, `YYYY-MM-DD`) define the visible range for `usage.byDay` and `meta`. Weekly\n\
        \  aggregates in `usage.byWeek` still reflect full ISO weeks that overlap that range.\n- Optional\
        \ `depotId`: restrict results to quotas for that region (depot) and count only driver-days\n \
        \ attributed to that depot.\n- Optional `unitIds`: further restrict to quotas that apply to those\
        \ operational units\n  and count only driver-days in those units. Omit or leave empty for no unit\
        \ filter.\n\n**Unit quotas vs depot-level `quota`**\n- When a quota row has **unit-level limits**\
        \ (`depotQuota.unitQuotas` is non-empty), effective caps and\n  aggregate usage follow those **per-unit**\
        \ rows. Inspect `usage.byUnit` for per-unit usage; the\n  optional top-level `depotQuota.quota`\
        \ field is **not** the active limit for totals in that configuration\n  (it may still be present\
        \ in the response for schema compatibility—**ignore it for enforcement** when\n  unit rows exist).\n\
        - When there are **no** unit rows (`unitQuotas` is an empty array), the depot-level `depotQuota.quota`\n\
        \  applies to the whole depot bucket for that quota."
      summary: List absence quota usage
      tags:
      - Driver Absences
      security:
      - api_key: []
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAbsenceQuotasRequest'
