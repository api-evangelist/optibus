              schema:
                $ref: '#/components/schemas/PostDriverAbsencesErrorResponse'
              examples:
                Example 1:
                  value:
                    error:
                      type: negativeBalanceViolation
                      message: One or more absences would cause negative balance violations
                      details:
                        drivers:
                        - driverId: string
                          violatedBanks:
                          - string
                        summary:
                          affectedDrivers: 0
      description: "Creates or updates absences for drivers. As input, provide a list of absence entries\
        \ to create or update.\n\nNotes:\n- Behaviour of the `absenceId` field:\n  - If an `absenceId`\
        \ is specified that already exists, the existing absence will be updated.\n  - If an `absenceId`\
        \ is specified that does not already exist, a new absence will be created with the specified ID.\n\
        \  - We recommend you set the `absenceId` to a corresponding fixed identifier from your external\
        \ system that you are synchronizing with.\n- Information about the modelling of date/time periods\
        \ for each entry:\n  - `startDate` is mandatory\n  - `endDate` is optional - if omitted, the downtime\
        \ will be ongoing indefinitely\n  - `startTime` and `endTime` are optional - if omitted, the downtime\
        \ will be for the entire day(s) specified by `startDate` and `endDate`\n- Each request is atomic\
        \ - either all downtimes listed in the request are created/updated successfully, or none are created/updated.\n\
        - This API does not auto-unassign overlapping duties. When absences are created via the web client,\
        \ the UI automatically unassigns drivers from any duties that overlap the new absences. This API\
        \ does not perform that step — drivers will remain assigned to any overlapping duties.\n- If your\
        \ Ops instance has the `entitlementBanksEffectiveDate` feature active (you can ask your Optibus\
        \ contact about this), then the API will perform additional validations:\n  - The API will validate\
        \ that the absences do not cause negative balance violations for entitlement banks that do not\
        \ allow negative balances.\n  - If violations are detected, the API will return HTTP 422 with\
        \ details about which drivers have violations and which banks are affected.\n  - The HTTP 422\
        \ error can only occur when ALL of the following conditions are met:\n    - The `entitlementBanksEffectiveDate`\
        \ feature flag is enabled\n    - Entitlement banks are configured and do NOT allow negative balances\n\
        \    - The driver has entitlements\n    - The absence is connected to the bank (by absence type)\n\
        \    - The driver would violate the balance constraints (would cause negative balance)\n    -\
        \ The `skipBalanceValidation` query parameter is NOT set to `true` (validation is enabled by default\
        \ when the parameter is not provided)\n- If your Ops instance has the `entitlementBanksDeductionOrder`\
        \ feature active and absence-type yearly caps are enabled (via the `absenceCapEnabled` Absences\
        \ preference), the API will additionally validate that no absence-type exceeds its configured\
        \ yearly `maxCap` (in calendar days, per bank-year window):\n  - If, after applying the imports,\
        \ a driver would exceed the cap for a given absence type, the API will return HTTP 422 with error\
        \ type `absenceTypeCapExceeded` and a list of the (driver, absence-type) pairs that exceed the\
        \ cap. Individual absence IDs are NOT enumerated — the driver is the unit that exceeds the cap,\
        \ and the caller resolves it by reducing the driver's total days for that absence type however\
        \ they choose.\n  - The `skipBalanceValidation=true` query parameter ALSO skips this cap validation\
        \ (a single opt-out for all entitlement-driven validation)."
      summary: Create/update driver absences
      tags:
      - Driver Absences
      security:
      - api_key: []
      parameters:
      - description: "- Optional query parameter. When set to `true`, skips ALL entitlement-driven validation:\
          \ both negative-balance checks (when `entitlementBanksEffectiveDate` is enabled) and absence-type\
          \ yearly-cap checks (when `entitlementBanksDeductionOrder` + `absenceCapEnabled` are enabled).\n\
          \  Defaults to `false` (validation enabled)."
        in: query
