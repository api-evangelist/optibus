      description: "Updates time off (entitlement) balances for drivers with effective dates.\n\nUse this\
        \ endpoint to import accrual-based policies from an external HR system or to pre-load\nbalances\
        \ for upcoming years. Each record sets the total balance for a driver/bank as of a\nspecific effective\
