    SupportedOrderStatus:
      type: string
      enum:
      - confirmed
      - cancelled
      - deleted
      description: 'Private hire order status.


        - `confirmed`: the order is meant to have been paid by the hiring entity.

        In the OPS Optibus platform, when a trip has any driver or vehicle associated, a warning message
        will be displayed to the inform the dispatchers about this fact.

        - `cancelled`: all trips of a private hire order have been cancelled and the resources associated
        to it, such as drivers and vehicles, have been freed up.

        - `deleted`: the order has been deleted as well as the trips belonging to that order. The resources
        associated to it, such as drivers and vehicles, have been freed up.'
