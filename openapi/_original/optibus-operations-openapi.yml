openapi: 3.0.0
components:
  examples: {}
  headers: {}
  parameters: {}
  requestBodies: {}
  responses: {}
  schemas:
    StringifyDate:
      type: string
      format: date
      description: Stringified ISO8601 date in the form of `YYYY-MM-dd`, for example `2017-07-21`
    AttributeValue:
      anyOf:
      - items:
          anyOf:
          - type: number
            format: double
          - type: string
        type: array
      - type: string
      - type: boolean
      - type: number
        format: double
    VehicleV1:
      properties:
        customAttributes:
          properties: {}
          additionalProperties:
            $ref: '#/components/schemas/AttributeValue'
          type: object
          description: Custom attributes for the vehicle, according to the 'Vehicle attributes' preference
            in your Ops instance. Returns the values for all custom attributes for the vehicle on the
            given date (either the date specified in the `onDate` query parameter, or today's date otherwise).
        decommissionedOnDate:
          $ref: '#/components/schemas/StringifyDate'
          description: The date the vehicle was/will be decommissioned on
        decommissioned:
          type: boolean
          description: Whether the vehicle is decommissioned on the given date (either the date specified
            in the `onDate` query parameter, or today's date otherwise)
        model:
          type: string
          description: The model of the vehicle
        type:
          type: string
          description: The type of the vehicle
        note:
          type: string
          description: A description of or note about the vehicle
        loanedRegionPeriods:
          items:
            properties:
              depotName:
                type: string
              regionName:
                type: string
            required:
            - regionName
            type: object
          type: array
          description: The loaned regions and depots that the vehicle is assigned to on the given date
            (either the date specified in the `onDate` query parameter, or today's date otherwise)
        mainRegionPeriod:
          properties:
            depotName:
              type: string
            regionName:
              type: string
          required:
          - regionName
          type: object
          description: The main region and depot that the vehicle is assigned to on the given date (either
            the date specified in the `onDate` query parameter, or today's date otherwise)
        parkingLocation:
          type: string
          description: The parking location of the vehicle
        licensePlate:
          type: string
          description: The license plate of the vehicle
        id:
          type: string
          description: Unique identifier for the vehicle
      required:
      - customAttributes
      - decommissioned
      - loanedRegionPeriods
      - mainRegionPeriod
      - id
      type: object
    Integer:
      type: integer
      format: int32
    PageNumber:
      $ref: '#/components/schemas/Integer'
      description: Page number (1-indexed). Defaults to 1.
      minimum: 1
    Pagination:
      properties:
        totalPages:
          $ref: '#/components/schemas/Integer'
          description: Total number of pages.
        nextPage:
          $ref: '#/components/schemas/PageNumber'
          description: Next page number (1-indexed). If undefined, there is no next page.
        currentPage:
          $ref: '#/components/schemas/PageNumber'
          description: Current page number (1-indexed).
      required:
      - totalPages
      - currentPage
      type: object
      description: 'Metadata about the pagination of a list of items. When a list of items is too large
        to be returned in a single response, it is split into multiple pages.

        This object informs you about the current page, the next page, and the total number of pages.'
    GetVehiclesV1SuccessfulResponse:
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        vehicles:
          items:
            $ref: '#/components/schemas/VehicleV1'
          type: array
      required:
      - pagination
      - vehicles
      type: object
    TypedErrorResponse_Invalidrequestschema_:
      properties:
        details: {}
        message:
          type: string
        type:
          type: string
          enum:
          - Invalid request schema
          nullable: false
      required:
      - message
      - type
      type: object
    TypedApiErrorResponse_Invalidrequestschema_:
      properties:
        error:
          $ref: '#/components/schemas/TypedErrorResponse_Invalidrequestschema_'
      required:
      - error
      type: object
    SchemaValidationErrorResponse:
      $ref: '#/components/schemas/TypedApiErrorResponse_Invalidrequestschema_'
    GetVehiclesV1ErrorTypes:
      type: string
      enum:
      - pageNotFound
      nullable: false
    TypedErrorResponse_GetVehiclesV1ErrorTypes_:
      properties:
        details: {}
        message:
          type: string
        type:
          $ref: '#/components/schemas/GetVehiclesV1ErrorTypes'
      required:
      - message
      - type
      type: object
    TypedApiErrorResponse_GetVehiclesV1ErrorTypes_:
      properties:
        error:
          $ref: '#/components/schemas/TypedErrorResponse_GetVehiclesV1ErrorTypes_'
      required:
      - error
      type: object
    GetVehiclesV1ErrorResponse:
      $ref: '#/components/schemas/TypedApiErrorResponse_GetVehiclesV1ErrorTypes_'
    UUID:
      type: string
      description: Stringified ID for a resource. Cannot exceed 36 characters.
    IdList:
      items:
        $ref: '#/components/schemas/UUID'
      type: array
      example:
      - item-123
      - item-456
      - item-789
      description: A list of IDs.
    PostVehiclesSuccessResponse:
      properties:
        createdVehicleIds:
          $ref: '#/components/schemas/IdList'
          description: List of vehicle IDs that were created.
      required:
      - createdVehicleIds
      type: object
    PostVehiclesErrorTypes:
      type: string
      enum:
      - tooManyItems
      - noItems
      - invalidFieldContent
      - vehicleAlreadyExists
      - conflictProcessingRequest
    TypedErrorResponse_PostVehiclesErrorTypes_:
      properties:
        details: {}
        message:
          type: string
        type:
          $ref: '#/components/schemas/PostVehiclesErrorTypes'
      required:
      - message
      - type
      type: object
    TypedApiErrorResponse_PostVehiclesErrorTypes_:
      properties:
        error:
          $ref: '#/components/schemas/TypedErrorResponse_PostVehiclesErrorTypes_'
      required:
      - error
      type: object
    PostVehiclesErrorResponse:
      $ref: '#/components/schemas/TypedApiErrorResponse_PostVehiclesErrorTypes_'
    NewVehicle:
      properties:
        customAttributes:
          properties: {}
          additionalProperties:
            $ref: '#/components/schemas/AttributeValue'
          type: object
          description: 'Custom attributes for the vehicle. Note that some custom attributes may be mandatory,
            according to the ''Vehicle attributes'' preference in your Ops instance.

            Should be a mapping of the ''attributeId'' (configured in your Ops instance) to the initial
            value for that custom attribute. The value will be validated according

            to the attribute definition configured in your Ops instance.'
        decommissionedOnDate:
          $ref: '#/components/schemas/StringifyDate'
          description: When the vehicle was decommissioned, if decommissioned is true.
        decommissioned:
          type: boolean
          description: Whether the vehicle is decommissioned.
        model:
          type: string
          description: The model of the vehicle, cannot exceed 36 characters.
        type:
          type: string
          description: The type of the vehicle. Depending on the 'Vehicle types' preference in your Ops
            instance, this may be mandatory. If specified, must be one of the vehicle types configured
            in your Ops instance.
        description:
          type: string
          description: A description of the vehicle, cannot exceed 65535 characters.
        depotName:
          type: string
          description: The name of the depot the vehicle is assigned to. If specified, should correspond
            to the 'unit' name returned by `GET /v1/regions`, and be a depot/unit belonging to the region.
        regionName:
          type: string
          description: The name of the region the vehicle is assigned to. Should correspond to the region
            name returned by `GET /v1/regions`.
        parkingLocation:
          type: string
          description: The parking location of the vehicle, cannot exceed 255 characters.
        licensePlate:
          type: string
          description: The license plate of the vehicle, cannot exceed 36 characters.
        id:
          type: string
          description: 'Unique identifier for the vehicle, cannot exceed 36 characters.

            Ideally corresponds to the ID for the vehicle in the external system that you are synchronizing
            with.'
      required:
      - regionName
      - id
      type: object
    PostVehiclesRequest:
      properties:
        vehicles:
          items:
            $ref: '#/components/schemas/NewVehicle'
          type: array
      required:
      - vehicles
      type: object
      example:
        vehicles:
        - id: abc-123
          regionName: North
          depotName: Main
          licensePlate: XYZ 999
          parkingLocation: Bay 30
          description: A note about the vehicle
          type: Double Decker
          model: Routemaster
          decommissioned: false
          customAttributes:
            color: red
            capacity: 42
        - id: def-456
          regionName: South
          depotName: Substation
          licensePlate: XYZ 999
          parkingLocation: Bay 31
          description: Another note about a vehicle
          type: Single Deck
          model: Metrodecker
          decommissioned: true
          decommissionedOnDate: '2024-01-01'
          customAttributes:
            color: blue
            capacity: 36
    PutVehiclesWarning:
      anyOf:
      - properties:
          details:
            items:
              properties:
                vehicleId:
                  type: string
              required:
              - vehicleId
              type: object
            type: array
            description: IDs of the vehicles whose existing region period starting today was overwritten.
          message:
            type: string
            description: Human-readable description of the warning.
          type:
            type: string
            enum:
            - overwriteMainRegionPeriodEntry
            nullable: false
        required:
        - details
        - message
        - type
        type: object
      - properties:
          details:
            items:
              properties:
                attributeIds:
                  items:
                    type: string
                  type: array
                vehicleId:
                  type: string
              required:
              - attributeIds
              - vehicleId
              type: object
            type: array
            description: Per-vehicle breakdown of which custom attribute IDs had their entry starting
              today overwritten.
          message:
            type: string
            description: Human-readable description of the warning.
          type:
            type: string
            enum:
            - overwriteCustomAttributeEntry
            nullable: false
        required:
        - details
        - message
        - type
        type: object
    PutVehiclesSuccessResponse:
      properties:
        warnings:
          items:
            $ref: '#/components/schemas/PutVehiclesWarning'
          type: array
          description: 'Non-fatal warnings about side effects of the request (for example, entries starting
            today being overwritten).

            Omitted when there are no warnings.'
        updatedVehicleIds:
          $ref: '#/components/schemas/IdList'
          description: List of vehicle IDs that were updated.
      required:
      - updatedVehicleIds
      type: object
    PutVehiclesErrorTypes:
      type: string
      enum:
      - tooManyItems
      - noItems
      - invalidFieldContent
      - vehiclesNotFound
      - conflictProcessingRequest
    TypedErrorResponse_PutVehiclesErrorTypes_:
      properties:
        details: {}
        message:
          type: string
        type:
          $ref: '#/components/schemas/PutVehiclesErrorTypes'
      required:
      - message
      - type
      type: object
    TypedApiErrorResponse_PutVehiclesErrorTypes_:
      properties:
        error:
          $ref: '#/components/schemas/TypedErrorResponse_PutVehiclesErrorTypes_'
      required:
      - error
      type: object
    PutVehiclesErrorResponse:
      $ref: '#/components/schemas/TypedApiErrorResponse_PutVehiclesErrorTypes_'
    EditedVehicle:
      properties:
        customAttributes:
          properties: {}
          additionalProperties:
            $ref: '#/components/schemas/AttributeValue'
          type: object
          description: 'Custom attributes for the vehicle. Note that some custom attributes may be mandatory,
            according to the ''Vehicle attributes'' preference in your Ops instance.

            Should be a mapping of the ''attributeId'' (configured in your Ops instance) to the initial
            value for that custom attribute. The value will be validated according

            to the attribute definition configured in your Ops instance.'
        decommissionedOnDate:
          $ref: '#/components/schemas/StringifyDate'
          description: When the vehicle was decommissioned, if decommissioned is true.
        decommissioned:
          type: boolean
          description: Whether the vehicle is decommissioned.
        model:
          type: string
          description: The model of the vehicle, cannot exceed 36 characters.
        type:
          type: string
          description: The type of the vehicle. Depending on the 'Vehicle types' preference in your Ops
            instance, this may be mandatory. If specified, must be one of the vehicle types configured
            in your Ops instance.
        description:
          type: string
          description: A description of the vehicle, cannot exceed 65535 characters.
        mainRegionPeriod:
          properties:
            depotName:
              type: string
              description: The name of the depot the vehicle is assigned to. If specified, should correspond
                to the 'unit' name returned by `GET /v1/regions`, and be a depot/unit belonging to the
                region.
            regionName:
              type: string
              description: The name of the region the vehicle is assigned to. Should correspond to the
                region name returned by `GET /v1/regions`.
          required:
          - regionName
          type: object
          description: "The main region (and, optionally, depot) that the vehicle is assigned to from\
            \ today onwards.\nShape matches the `mainRegionPeriod` returned by `GET /v1/vehicles`.\n\n\
            This field is optional for backwards-compatibility: existing integrations that do not send\
            \ it\nwill continue to work unchanged.\n\nNote: unlike other optional fields on this endpoint,\
            \ omitting `mainRegionPeriod` does NOT clear\nthe vehicle's current region assignment. Every\
            \ vehicle must always belong to a region, so there\nis no way to remove a region assignment\
            \ - you can only change it to a different region. If you\nwant to leave the current region\
            \ and depot untouched, you have two equivalent options:\n  1. Omit this field entirely from\
            \ the request item, or\n  2. Send the same `mainRegionPeriod` value currently returned by\
            \ `GET /v1/vehicles` for the\n     vehicle (when the requested value matches the vehicle's\
            \ current assignment, no change is\n     made and no warning is emitted).\n\nWhen specified:\n\
            - If the region and depot match the vehicle's current assignment, nothing changes.\n- Otherwise,\
            \ a new region period is created starting from today (in the customer's timezone).\n- If a\
            \ region period already exists starting today, it is overwritten in place and an\n  `overwriteMainRegionPeriodEntry`\
            \ warning is returned in the response."
        parkingLocation:
          type: string
          description: The parking location of the vehicle, cannot exceed 255 characters.
        licensePlate:
          type: string
          description: The license plate of the vehicle, cannot exceed 36 characters.
        id:
          type: string
          description: Unique identifier for the vehicle - should match a vehicle already created in Ops
            (either via the API, import process, or the Ops user interface)
      required:
      - id
      type: object
    PutVehiclesRequest:
      properties:
        vehicles:
          items:
            $ref: '#/components/schemas/EditedVehicle'
          type: array
      required:
      - vehicles
      type: object
      example:
        vehicles:
        - id: abc-123
          licensePlate: XYZ 999
          parkingLocation: Bay 30
          description: A note about the vehicle
          type: Double Decker
          model: Routemaster
          decommissioned: false
          customAttributes:
            color: red
            capacity: 42
        - id: def-456
          licensePlate: XYZ 999
          parkingLocation: Bay 31
          description: Another note about a vehicle
          type: Single Deck
          model: Metrodecker
          decommissioned: true
          decommissionedOnDate: '2024-01-01'
          customAttributes:
            color: blue
            capacity: 36
    DepotPeriodType:
      enum:
      - MAIN
      - LOAN
      - FIRST
      type: string
    BaseDepotPeriod:
      properties:
        opUnitId:
          type: string
        endTime:
          $ref: '#/components/schemas/Integer'
        startTime:
          $ref: '#/components/schemas/Integer'
        endDate:
          $ref: '#/components/schemas/StringifyDate'
        startDate:
          $ref: '#/components/schemas/StringifyDate'
        depotId:
          type: string
        type:
          $ref: '#/components/schemas/DepotPeriodType'
        periodId:
          type: string
      required:
      - startDate
      - depotId
      - type
      - periodId
      type: object
    VehicleDepotPeriod:
      allOf:
      - $ref: '#/components/schemas/BaseDepotPeriod'
      - properties:
          vehicleId:
            type: string
        required:
        - vehicleId
        type: object
    GetVehiclesDepotPeriodsResponse:
      properties: {}
      additionalProperties:
        items:
          $ref: '#/components/schemas/VehicleDepotPeriod'
        type: array
      type: object
    MinutesFromMidnightTime:
      type: integer
      format: int32
      description: Wall clock time, represented as minutes since midnight. For example, `0` is midnight
        (start of the day), `120` is 02:00 (2 hours after midnight), `180` is 02:30 (2.5 hours after midnight),
        `1560` is 02:00 the _next day_ (26 hours after midnight), etc.
    VehicleDowntime:
      properties:
        note:
          type: string
          description: A note about the downtime
        endTime:
          $ref: '#/components/schemas/MinutesFromMidnightTime'
        startTime:
          $ref: '#/components/schemas/MinutesFromMidnightTime'
        endDate:
          $ref: '#/components/schemas/StringifyDate'
        startDate:
          $ref: '#/components/schemas/StringifyDate'
        vehicleId:
          type: string
          description: ID of the vehicle this downtime applies to
        downtimeId:
          type: string
          description: Unique identifier for the downtime
      required:
      - startDate
      - vehicleId
      - downtimeId
      type: object
    GetVehiclesDowntimesSuccess:
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        downtimes:
          items:
            $ref: '#/components/schemas/VehicleDowntime'
          type: array
      required:
      - pagination
      - downtimes
      type: object
      example:
        downtimes:
        - downtimeId: downtime-1
          vehicleId: vehicle-1
          startDate: '2024-01-01'
          endDate: '2024-01-02'
          startTime: 120
          endTime: 180
          note: Vehicle is being serviced for a discrete time period (02:00 on 1st January until 02:30
            on 2nd January)
        - downtimeId: downtime-2
          vehicleId: vehicle-2
          startDate: '2024-01-03'
          startTime: 360
          note: Vehicle is being serviced starting at 06:00 on 3rd January, and the downtime is ongoing
            indefinitely
        - downtimeId: downtime-3
          vehicleId: vehicle-3
          startDate: '2024-01-04'
          endDate: '2024-01-05'
          note: Vehicle is being serviced all day on the 4th and 5th January
        pagination:
          currentPage: 1
          nextPage: 2
          totalPages: 2
    GetVehiclesDowntimesErrorTypes:
      type: string
      enum:
      - invalidDatesCombination
      - pageNotFound
    TypedErrorResponse_GetVehiclesDowntimesErrorTypes_:
      properties:
        details: {}
        message:
          type: string
        type:
          $ref: '#/components/schemas/GetVehiclesDowntimesErrorTypes'
      required:
      - message
      - type
      type: object
    TypedApiErrorResponse_GetVehiclesDowntimesErrorTypes_:
      properties:
        error:
          $ref: '#/components/schemas/TypedErrorResponse_GetVehiclesDowntimesErrorTypes_'
      required:
      - error
      type: object
    GetVehiclesDowntimesErrorResponse:
      $ref: '#/components/schemas/TypedApiErrorResponse_GetVehiclesDowntimesErrorTypes_'
    PutVehiclesDowntimesSuccessResponse:
      properties:
        createDowntimeIds:
          $ref: '#/components/schemas/IdList'
          description: List of downtime IDs that were created.
        modifiedDowntimeIds:
          $ref: '#/components/schemas/IdList'
          description: List of downtime IDs that were modified.
      required:
      - createDowntimeIds
      - modifiedDowntimeIds
      type: object
    PutVehiclesDowntimesErrorTypes:
      type: string
      enum:
      - tooManyItems
      - noItems
      - invalidFieldContent
      - vehiclesNotFound
      - conflictProcessingRequest
    TypedErrorResponse_PutVehiclesDowntimesErrorTypes_:
      properties:
        details: {}
        message:
          type: string
        type:
          $ref: '#/components/schemas/PutVehiclesDowntimesErrorTypes'
      required:
      - message
      - type
      type: object
    TypedApiErrorResponse_PutVehiclesDowntimesErrorTypes_:
      properties:
        error:
          $ref: '#/components/schemas/TypedErrorResponse_PutVehiclesDowntimesErrorTypes_'
      required:
      - error
      type: object
    PutVehiclesDowntimesErrorResponse:
      $ref: '#/components/schemas/TypedApiErrorResponse_PutVehiclesDowntimesErrorTypes_'
    PutVehicleDowntimeEntry:
      properties:
        note:
          type: string
          description: A note describing the downtime. Cannot exceed 65535 characters.
        endTime:
          $ref: '#/components/schemas/MinutesFromMidnightTime'
        startTime:
          $ref: '#/components/schemas/MinutesFromMidnightTime'
        endDate:
          $ref: '#/components/schemas/StringifyDate'
        startDate:
          $ref: '#/components/schemas/StringifyDate'
        vehicleId:
          type: string
          description: 'ID of the vehicle this downtime applies to. Note: you may not modify the vehicle
            ID for an existing downtime, and will receive an error if you try to do so.'
        downtimeId:
          type: string
          description: ID of the vehicle downtime to create or update. Must be unique within the request.
            Cannot exceed 36 characters.
      required:
      - startDate
      - vehicleId
      type: object
    PutVehiclesDowntimesRequest:
      properties:
        downtimes:
          items:
            $ref: '#/components/schemas/PutVehicleDowntimeEntry'
          type: array
      required:
      - downtimes
      type: object
      example:
        downtimes:
        - downtimeId: downtime-1
          vehicleId: vehicle-1
          startDate: '2024-01-01'
          endDate: '2024-01-02'
          startTime: 120
          endTime: 180
          note: Vehicle is being serviced for a discrete time period (02:00 on 1st January until 02:30
            on 2nd January)
        - downtimeId: downtime-2
          vehicleId: vehicle-2
          startDate: '2024-01-03'
          startTime: 360
          note: Vehicle is being serviced starting at 06:00 on 3rd January, and the downtime is ongoing
            indefinitely
        - downtimeId: downtime-3
          vehicleId: vehicle-3
          startDate: '2024-01-04'
          endDate: '2024-01-05'
          note: Vehicle is being serviced all day on the 4th and 5th January
    VehicleCustomAttributeEntry:
      properties:
        attributeId:
          type: string
          description: ID of the attribute this custom attribute entry applies to, corresponding to the
            attribute definition in the "Vehicle attributes" preference in your Ops instance
        endDate:
          $ref: '#/components/schemas/StringifyDate'
        startDate:
          $ref: '#/components/schemas/StringifyDate'
        value:
          $ref: '#/components/schemas/AttributeValue'
          description: Value of the custom attribute
        vehicleId:
          type: string
          description: ID of the vehicle this custom attribute entry applies to
        entryId:
          type: string
          description: Unique identifier for the custom attribute entry
      required:
      - attributeId
      - startDate
      - value
      - vehicleId
      - entryId
      type: object
    GetVehiclesCustomAttributesSuccess:
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        entries:
          items:
            $ref: '#/components/schemas/VehicleCustomAttributeEntry'
          type: array
      required:
      - pagination
      - entries
      type: object
      example:
        entries:
        - entryId: entry-123
          vehicleId: vehicle-1
          value: red
          startDate: '2024-01-01'
          endDate: '2024-01-02'
          attributeId: color
        - entryId: entry-456
          vehicleId: vehicle-1
          value: green
          startDate: '2024-01-03'
          attributeId: color
        pagination:
          currentPage: 1
          nextPage: 2
          totalPages: 2
    GetVehiclesCustomAttributesErrorTypes:
      type: string
      enum:
      - invalidDatesCombination
      - pageNotFound
    TypedErrorResponse_GetVehiclesCustomAttributesErrorTypes_:
      properties:
        details: {}
        message:
          type: string
        type:
          $ref: '#/components/schemas/GetVehiclesCustomAttributesErrorTypes'
      required:
      - message
      - type
      type: object
    TypedApiErrorResponse_GetVehiclesCustomAttributesErrorTypes_:
      properties:
        error:
          $ref: '#/components/schemas/TypedErrorResponse_GetVehiclesCustomAttributesErrorTypes_'
      required:
      - error
      type: object
    GetVehiclesCustomAttributesErrorResponse:
      $ref: '#/components/schemas/TypedApiErrorResponse_GetVehiclesCustomAttributesErrorTypes_'
    PutVehiclesCustomAttributesSuccessResponse:
      properties:
        createdEntryIds:
          $ref: '#/components/schemas/IdList'
        modifiedEntryIds:
          $ref: '#/components/schemas/IdList'
      required:
      - createdEntryIds
      - modifiedEntryIds
      type: object
    PutVehiclesCustomAttributesErrorTypes:
      type: string
      enum:
      - tooManyItems
      - noItems
      - invalidFieldContent
      - vehiclesNotFound
      - invalidAttributeTimeline
      - conflictProcessingRequest
    TypedErrorResponse_PutVehiclesCustomAttributesErrorTypes_:
      properties:
        details: {}
        message:
          type: string
        type:
          $ref: '#/components/schemas/PutVehiclesCustomAttributesErrorTypes'
      required:
      - message
      - type
      type: object
    TypedApiErrorResponse_PutVehiclesCustomAttributesErrorTypes_:
      properties:
        error:
          $ref: '#/components/schemas/TypedErrorResponse_PutVehiclesCustomAttributesErrorTypes_'
      required:
      - error
      type: object
    PutVehiclesCustomAttributesErrorResponse:
      $ref: '#/components/schemas/TypedApiErrorResponse_PutVehiclesCustomAttributesErrorTypes_'
    PutVehiclesCustomAttributesEntry:
      properties:
        endDate:
          $ref: '#/components/schemas/StringifyDate'
