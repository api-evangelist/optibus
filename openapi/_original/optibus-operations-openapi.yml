  /v2/signing-times:
    get:
      operationId: GetSigningTimesV2
      responses:
        '200':
          description: Signing times fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSigningTimesV2SuccessfulResponse'
        '400':
          description: 'Possible error types: `Invalid request schema` (schema of your request does not
            match the specification — e.g. `date` or `regionName` not supplied, or `date` is not a valid
            `YYYY-MM-DD` date)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaValidationErrorResponse'
        '404':
          description: 'Possible error types: `pageNotFound` (requested page number is out of range; details.totalPages
            indicates the number of pages available)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSigningTimesV2ErrorResponse'
      description: 'Returns matched expected/actual sign-on and sign-off times for drivers on a given
        date in a region.


        Notes:

        - The result is paginated by driver, 100 drivers per page. Check the `pagination` property in
        the response for total pages.

        - A driver appears in the response if their main or loaned region is the requested region on the
        date, regardless of whether they have a calendar task. Drivers without any tasks or actual signings
        on the date appear with `signingTimes: []`.

        - Orphaned signings (for example, an actual sign-on left behind after a previously-assigned task
        was unassigned or sign-on/off task-event was deleted) still appear here as entries with `orphaned:
        true`. If the original expected time is known, it will still be returned; otherwise `expectedTime`
        will be `null`.

        - `regionName` must match the name of a region returned by `GET /v1/regions`. An unknown region
        returns an empty result (no error).

        - Driver IDs in the response are the same external driver IDs accepted by `GET /v2/drivers` and
        other v2 endpoints.'
      summary: List driver signing times for a date in a region
      tags:
      - Signing Times
      security:
      - api_key: []
      parameters:
      - description: '- Operational date in `YYYY-MM-dd` format.'
        in: query
        name: date
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- Name of the region for which to return signing times.'
        in: query
        name: regionName
        required: true
        schema:
          type: string
      - description: '- Comma-separated list of driver IDs to further narrow the result. Only drivers
          whose main or loaned region is the requested region on the date are eligible regardless of this
          filter.'
        in: query
        name: driverIds
        required: false
        schema:
          type: array
          items:
            type: string
      - description: '- 1-indexed integer indicating which page of results to pull. Defaults to 1.'
        in: query
        name: page
        required: false
        schema:
          $ref: '#/components/schemas/PageNumber'
  /v1/drivers/signing-deviations:
    get:
      operationId: GetDriversSigningDeviations
      responses:
        '200':
          description: Drivers signing deviations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSigningDeviationsResponse'
        '400':
          description: End date cannot be before start date
        '422':
          description: Signing deviations validation rules are not defined for this customer
      description: 'Calculate the signing deviations for the drivers in the given date range and region.
        ''Signing deviations'' refer to the difference between

        the actual and expected sign-on and sign-off times for a driver. The expected times are calculated
        based on the driver''s assigned work.


        Deviation might be classified either early or late, calculated according to a defined threshold.'
      summary: Fetch signing deviations
      tags:
      - Signing Times
      security:
      - api_key: []
      parameters:
      - description: The start of the date range to get the signing deviations from
        in: query
        name: from
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: The end of the date range to get the signing deviations from
        in: query
        name: to
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: The region to get the signing deviations from
        in: query
        name: regionUuid
        required: true
        schema:
          $ref: '#/components/schemas/DepotId'
      - description: The driver IDs for which to get the signing deviations. if empty all drivers will
          be returned
        in: query
        name: driverIds
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/DriverId'
  /v2/drivers:
    get:
      operationId: GetDriversV2
      responses:
        '200':
          description: Drivers fetched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDriversV2SuccessfulResponse'
        '404':
          description: 'Possible error types: `pageNotFound` (requested page number is out of range; details.totalPages
            indicates the number of pages available)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDriversV2ErrorResponse'
      description: 'List existing drivers in the system, with optional filtering capability.


        Notes:

        - The result is paginated. Check the `pagination` property in the response to see the total number
        of pages and the current page number.'
      summary: List drivers
      tags:
      - Drivers
      security:
      - api_key: []
      parameters:
      - description: '- Comma-separated list of driver IDs to filter for'
        in: query
        name: driverIds
        required: false
        schema:
          type: array
          items:
            type: string
      - description: '- Date string formatted as `YYYY-MM-dd` for which we want data returned. If not
          provided, today''s date will be used. The date specified here affects the data returned for
          certain properties such as `mainRegionPeriod`, `loanedRegionPeriods`, and `customAttributes`,
          and also the behaviour of the `isEmployed` and `regionNames` query parameters.'
        in: query
        name: onDate
