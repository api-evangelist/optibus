        '302':
          description: For very large responses, the result is served as a presigned S3 file. This redirection is handled automatically by the majority of clients.
        '400':
          description: Missing request parameters. Both toDate and fromDate are required. For example, ?fromDate=2022-032-7&toDate=2022-04-16
        '403':
          description: The request was not successfully authenticated. Ensure the authentication header is correctly set.
        '404':
          description: One or more of the requested depots was not found.
        '414':
          description: The request URI exceeds 10240 bytes which is not supported. This probably results from trying to query more than a thousand driverIds at the same time. Please consider chunking your request.
        '500':
          description: The request was not successful.
        '503':
          description: The request was not successful. Please try again.
      description: 'Returns the daily operational plans for a specified date range. This endpoint provides comprehensive operational data including tasks, assignments, blocks, drivers, and vehicles.


        **Spare Types Support**: When the spare types feature flag is enabled, spare tasks will include additional properties:

        - `spareType`: The spare type code (e.g., "SPARE1", "SPARE2")

        - `displayId`: Will show the configured spare type name instead of the original display ID

        - `dutyType`: Will be set to "spare" for spare tasks

        - `startTime` and `endTime`: Will be included in the task summary for spare tasks based on the relevant spare type preference configuration'
      summary: Fetch operational plan (v2)
      tags:
      - Operational Plan
      security:
      - api_key: []
      parameters:
      - description: '- Returns the operational plans from this date (both fromDate and toDate are required). Date format is YYYY-MM-DD'
        in: query
        name: fromDate
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- Returns the daily operational plans to this date (both fromDate and toDate are required). Date format is YYYY-MM-DD'
        in: query
        name: toDate
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- When specified, the response will contain only these depots. When including more than one depot the request param can be a comma separated list (eg depotUuids=A,B) or you can use several request params (eg depotUuids=A?depotUuids=B)"'
        in: query
        name: depotUuids
        required: false
        schema:
          type: string
        example: 72999313-c6d3-44a3-9e64-a8cbce779ed7,e09cc074-b949-4d39-97b5-d2fa5eb1cdc5
      - description: '- When specified, the response wil include only assignments for these drivers. When including more than one driver the request param can be a comma separated list (eg driverUuids=A,B) or you can use several request params (eg driverUuids=A?driverUuids=B)'
        in: query
        name: driverUuids
        required: false
        schema:
          type: string
      - description: '-  When true, the response will include a full stop list on each trip. Otherwise only origin and destination are included in request. (Usage may cause requests to take a long time)'
        in: query
        name: includeStops
        required: false
        schema:
          type: string
      - description: '-  In conjunction with supplying driver ids, When true return unassigned tasks as well as assigned tasks according to the driver filter.'
        in: query
        name: includeUnassigned
        required: false
        schema:
          type: string
      - description: '- When true, the response will include the properties of the plannedAssignments'
        in: query
        name: fetchPlannedAssignmentsProperties
        required: false
        schema:
          type: boolean
      - description: '- When specified, filters tasks, blocks, task assignments, and block assignments to only include those associated with the provided task display IDs. Can be a comma separated list (eg taskDisplayIds=T1,T2)'
        in: query
        name: taskDisplayIds
        required: false
        schema:
          type: string
        example: T100,T200,T300
      - description: '- When true, exclude cancelled (disabled) tasks from driverAssignments, vehicleAssignments, and plannedAssignments. Defaults to false.'
        in: query
        name: excludeCancelledTasks
        required: false
        schema:
          type: boolean
      - description: '- When true, include actual signing times (signOnActual, signOffActual) in assignment properties attributes. Times are ISO 8601 datetime strings in the customer''s operational timezone (no UTC offset), or null if the driver has not yet signed. Defaults to false.'
        in: query
        name: includeActualSigningTimes
        required: false
        schema:
          type: boolean
  /calendar-planned-assignments:
    get:
      operationId: GetCalendarPlannedAssignments
      responses:
        '200':
          description: The operational planned assignment for the specified time range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCalendarPlannedAssignmentsResponse'
        '403':
          description: The request was not successfully authenticated. Ensure the authentication header is correctly set.
        '404':
          description: One or more of the requested depots was not found.
        '414':
          description: The request URI exceeds 10240 bytes which is not supported. This probably results from trying to query more than a thousand driversIds/taskIds at the same time. Please consider chunking your request.
      description: 'Returns the calendar planned assignments and tasks, with filters.


        **Spare Types Support**: When the spare types feature flag is enabled, spare tasks will include additional properties:

        - `spareType`: The spare type code (e.g., "SPARE1", "SPARE2")

        - `displayId`: Will show the configured spare type name instead of the original display ID

        - `dutyType`: Will be set to "spare" for spare tasks

        - `startTime` and `endTime`: Will be included in the task summary for spare tasks based on the relevant spare type preference configuration'
      summary: List calendar planned assignments
      tags:
      - Operational Plan
      security:
      - api_key: []
      parameters:
      - description: '- Returns the calendar planned assignments for this depot ID'
        in: query
        name: depotId
        required: true
        schema:
          type: string
      - description: '- Returns the calendar planned assignments from this date (both startDate and endDate are required)'
        in: query
        name: startDate
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- Returns the calendar planned assignments to this date (both startDate and endDate are required)'
        in: query
        name: endDate
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- optional. When true, the response will *only* contain planned assignments that have drivers assigned to them'
        in: query
        name: assignedOnly
        required: false
        schema:
          type: boolean
      - description: '- optional. Returns the calendar planned assignments for the filtered driver IDs (when this filter is used, the response won''t include unassigned tasks)'
        in: query
        name: driverIds
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
      - description: '-  optional. When true, the response will *also* contain the tasks stops'
        in: query
        name: fetchStops
        required: false
        schema:
          type: boolean
  /v1/calendar-driver-day-labels:
    get:
      operationId: GetCalendarDriverDayLabels
      responses:
        '200':
          description: The driver day labels for the specified time range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetDriverDayLabelsResponse'
        '403':
          description: The request was not successfully authenticated. Ensure the authentication header is correctly set.
        '414':
          description: The request URI exceeds 10240 bytes which is not supported. This probably results from trying to query more than a thousand driversIds/taskIds at the same time. Please consider chunking your request.
      description: Returns the calendar planned assignments and tasks, with filters.
      summary: List driver day labels
      tags:
      - Operational Plan
      security:
      - api_key: []
      parameters:
      - description: '- Returns the driver day labels from this date (both fromDate and toDate are required)'
        in: query
        name: fromDate
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- Returns the the driver day labels to this date (both fromDate and toDate are required)'
        in: query
        name: toDate
        required: true
        schema:
          $ref: '#/components/schemas/StringifyDate'
      - description: '- optional. Returns the driver day labels for the filtered driver IDs'
        in: query
        name: driverIds
        required: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/UUID'
