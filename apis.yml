aid: optibus
name: Optibus
description: 'Optibus is a cloud-native, end-to-end operating system for public transportation
  planning, scheduling, rostering and operations, used by transit agencies and operators
  in more than 3,000 cities. Its proprietary AI and optimization algorithms modernize network
  planning, vehicle and crew scheduling, driver rostering, fleet monitoring, payroll and depot
  management. The Optibus Operations API (OpenAPI 3.0.0, 58 operations) provides programmatic
  access to drivers, vehicles, absences, employment periods, operational plans, rosters, payroll
  and statistics, plus outbound HMAC-signed operational event webhooks, for integrating Optibus
  with external HR, payroll and fleet-management systems. Backed by Bessemer Venture Partners and
  Insight Partners.'
url: https://raw.githubusercontent.com/api-evangelist/optibus/refs/heads/main/apis.yml
x-type: company
